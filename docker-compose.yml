services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: tabibi
      POSTGRES_USER: tabibi
      POSTGRES_PASSWORD: tabibi_dev_only
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tabibi -d tabibi']
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - tabibi-postgres:/var/lib/postgresql/data

volumes:
  tabibi-postgres:
