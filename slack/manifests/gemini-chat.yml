display_information:
  name: Gemini Chat
  description: Tabibi adaptive generalist collaborator
features:
  bot_user:
    display_name: Gemini Chat
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - channels:read
      - channels:history
      - channels:join
      - reactions:write
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
