name: L5 v1.1 Sync Once

on:
  push:
    branches:
      - l5/claude-hostile-controller
    paths:
      - .github/workflows/l5-v11-sync-once.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: l5/claude-hostile-controller
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Synchronize certified shared L5.1 core
        shell: bash
        run: |
          set -euo pipefail
          source_base='https://raw.githubusercontent.com/NTinkicht/OneCompany/l5/claude-hostile-controller'
          for path in \
            scripts/l5_kernel.py \
            scripts/l5_ledger.py \
            scripts/l5_controller.py \
            scripts/l5_intent_hostile_sim.py \
            tests/test_l5_controller.py \
            tests/test_l5_intent_restraint.py \
            docs/L5-STATE-MACHINE-V1.md \
            docs/L5-INTENT-RESTRAINT-V1.1.md
          do
            mkdir -p "$(dirname "$path")"
            curl --fail --silent --show-error --location "$source_base/$path" --output "$path"
          done
          python - <<'PY'
          from pathlib import Path

          controller = Path('scripts/l5_controller.py')
          text = controller.read_text(encoding='utf-8')
          text = text.replace('from l5_activation import authorize_mutation', 'from l5_recovery import authorize_mutation')
          controller.write_text(text, encoding='utf-8')

          recovery = Path('scripts/l5_recovery.py')
          text = recovery.read_text(encoding='utf-8')
          needle = '    "PLAN_REPLENISH_READY_WU": "reserve_next_wu",\n'
          if '"RECONCILE_HEAD_BASE": "update_branch"' not in text:
              if needle not in text:
                  raise SystemExit('SAFE_MUTATIONS insertion point missing')
              text = text.replace(needle, needle + '    "RECONCILE_HEAD_BASE": "update_branch",\n', 1)
          recovery.write_text(text, encoding='utf-8')
          PY
      - name: Validate L5.1 unit suite
        run: python -m unittest discover -s tests -p 'test_l5_*.py'
      - name: Certify S1-S30
        run: python scripts/l5_hostile_sim.py
      - name: Certify S31-S40
        run: python scripts/l5_intent_hostile_sim.py
      - name: Commit synchronized hardening
        shell: bash
        run: |
          git config user.name 'l5-human-authorized-hardening'
          git config user.email 'actions@users.noreply.github.com'
          git checkout HEAD -- .github/workflows/l5-v11-sync-once.yml
          git add scripts tests docs
          git commit -m 'feat(l5): add Engineering Intent and Restraint gate'
          git push origin HEAD:l5/claude-hostile-controller
