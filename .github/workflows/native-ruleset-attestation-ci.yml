name: Native Factory Ruleset Attestation Regression

on:
  pull_request:
    paths:
      - 'scripts/native_factory_merge.py'
      - 'scripts/native_factory_ruleset_attestation.py'
      - 'tests/test_native_factory_ruleset_attestation.py'
      - '.github/workflows/native-ruleset-attestation-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attestation-tests:
    name: Ruleset attestation adversarial tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -I -m unittest discover -s tests -p 'test_native_factory_ruleset_attestation.py' -v
      - run: python -I -m py_compile scripts/native_factory_merge.py scripts/native_factory_ruleset_attestation.py
