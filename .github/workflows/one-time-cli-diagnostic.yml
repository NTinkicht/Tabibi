name: One-time CLI Diagnostic Validation

on:
  push:
    branches:
      - chatgpt/issue-323-grok-private-dispatch

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/issue-323-grok-private-dispatch
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Format and verify
        run: |
          set -euo pipefail
          npm ci
          ./node_modules/.bin/prettier --write scripts/grok-dispatcher.mjs tests/unit/grok-dispatcher.test.ts
          npm run format
          npm run typecheck
          npm run lint
          npm run test:unit -- tests/unit/grok-dispatcher.test.ts
      - name: Push formatter-only changes
        run: |
          set -euo pipefail
          git add -- scripts/grok-dispatcher.mjs tests/unit/grok-dispatcher.test.ts
          if git diff --cached --quiet; then
            echo 'Already formatted'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: apply pinned formatter to Grok error diagnostics'
          git push origin HEAD:chatgpt/issue-323-grok-private-dispatch
