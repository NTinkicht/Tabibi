name: L5 Durable State Candidate CI

on:
  pull_request:
    paths:
      - 'scripts/l5_state_machine.py'
      - 'tests/l5_state_machine.test.py'
      - '.github/workflows/l5-durable-state-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: l5-durable-state-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  durable-state:
    name: L5 durable-state fail-closed regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Compile reducer and tests
        run: >-
          python -m py_compile scripts/l5_state_machine.py
          tests/l5_state_machine.test.py
      - name: Run reducer selftest
        run: python scripts/l5_state_machine.py --selftest
      - name: Run external regression tests
        run: python tests/l5_state_machine.test.py
