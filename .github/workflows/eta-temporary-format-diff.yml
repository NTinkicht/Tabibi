name: Temporary ETA formatting diagnostic
on:
  push:
    branches:
      - l5/issue-606-eta-uncertainty-adoption
permissions:
  contents: read
jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Print exact Prettier patch without committing
        run: |
          npx prettier --write src/modules/queue-eta-estimator/claim-publication.ts tests/integration/eta-source-publication.test.ts
          git --no-pager diff -- src/modules/queue-eta-estimator/claim-publication.ts tests/integration/eta-source-publication.test.ts
