name: SaveGrok One-Time Formatter
on:
  push:
    branches:
      - chatgpt/savegrok-editor-autostart
permissions:
  contents: write
concurrency:
  group: one-time-savegrok-autostart-format
  cancel-in-progress: true
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/savegrok-editor-autostart
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply exact project Prettier, typecheck and focused tests
        run: |
          set -euo pipefail
          npm ci
          ./node_modules/.bin/prettier --write .vscode/tasks.json scripts/grok-auto-start.mjs
          npm run format
          npm run typecheck
          npm run lint
          ./node_modules/.bin/vitest run tests/unit/grok-auto-start.test.ts
      - name: Commit formatter output
        run: |
          set -euo pipefail
          git add -- .vscode/tasks.json scripts/grok-auto-start.mjs
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(savegrok): apply project formatter to editor autostart'
          git push origin HEAD:chatgpt/savegrok-editor-autostart
