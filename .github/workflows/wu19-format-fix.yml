name: WU19 format fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'wu19-guest-status-sse'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: wu19-guest-status-sse
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply repository Prettier
        run: npx prettier --write src/app/api/guest/status/stream/route.ts tests/api/guest-status-stream.test.ts tests/e2e/guest-status-sse-lifecycle.spec.ts
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/guest/status/stream/route.ts tests/api/guest-status-stream.test.ts tests/e2e/guest-status-sse-lifecycle.spec.ts
          git diff --cached --quiet || git commit -m "chore(wu19): apply repository formatting"
          git push origin HEAD:wu19-guest-status-sse
