name: Temporary Exact Prettier Diff (WU96 diagnostics)

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Show exact formatter patch without committing
        run: |
          npx --no-install prettier --write src/app/PublicDiscoveryLandingClient.tsx tests/e2e/public-discovery-landing.spec.ts
          git diff -- src/app/PublicDiscoveryLandingClient.tsx tests/e2e/public-discovery-landing.spec.ts
