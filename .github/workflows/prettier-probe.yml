name: Prettier Probe
on:
  push:
    branches:
      - l5/claude-hostile-controller
    paths:
      - .github/workflows/prettier-probe.yml
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Print exact formatted workflow
        run: |
          npx prettier --write .github/workflows/l5-hostile-controller-ci.yml
          echo '---BEGIN-FORMATTED---'
          cat .github/workflows/l5-hostile-controller-ci.yml
          echo '---END-FORMATTED---'
