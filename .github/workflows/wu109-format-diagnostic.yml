name: WU109 disposable format diagnostic
on:
  push:
    branches: [chatgpt/wu109-search-shortcut]
permissions:
  contents: read
jobs:
  formatter-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Show exact Prettier delta for synthetic work-unit file
        shell: bash
        run: |
          npx prettier --write 'tests/e2e/public-discovery-landing.spec.ts'
          git diff -- 'tests/e2e/public-discovery-landing.spec.ts'
