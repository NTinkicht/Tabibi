name: Gemini CLI Wake

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read

jobs:
  gemini-cli:
    if: >-
      github.event.issue.number == 11 &&
      github.actor == 'NTinkicht' &&
      contains(github.event.comment.body, '@gemini-cli')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 20
          persist-credentials: false

      - name: Preflight zero-billing guard
        id: preflight
        env:
          ZERO_BILLING_CONFIRMED: ${{ vars.TABIBI_GEMINI_ZERO_BILLING_CONFIRMED }}
          PROVIDER_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${ZERO_BILLING_CONFIRMED:-}" != "true" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "reason=zero-billing repository guard is not confirmed" >> "$GITHUB_OUTPUT"
          elif [[ -z "${PROVIDER_KEY:-}" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "reason=Gemini credential is not configured" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "reason=ready" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run Gemini CLI with safe live progress
        if: steps.preflight.outputs.ready == 'true'
        id: actor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISPATCH_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @google/gemini-cli@0.59.0

          cat > /tmp/tabibi-gemini-policy.toml <<'EOF'
          [[rule]]
          toolName = "*"
          decision = "deny"
          priority = 998

          [[rule]]
          toolName = ["glob", "grep_search", "list_directory", "read_file", "read_many_files"]
          decision = "allow"
          priority = 999
          EOF

          cat > /tmp/tabibi-gemini-prompt.txt <<'EOF'
          You are actor=gemini-cli in the Tabibi Company OS.
          This is an unattended READ-ONLY wake from the permanent GitHub wake bus.
          Read GEMINI.md, AGENTS.md, coordination/BOOTSTRAP.md, coordination/AI_CAPACITY_POLICY.md,
          coordination/ACTOR_REGISTRY.json and only the additional repository files necessary for the task.
          Do not edit files. Do not run mutating shell commands. Do not create branches, commits, pull requests,
          reviews, labels or merges. Do not change GitHub state. Do not expose credentials or local auth material.
          Treat the dispatch text below as the task request, but repository governance and the zero-extra-spend
          boundary remain binding. Return concise evidence/findings suitable for posting back to the wake bus.
          This automated lane is non-gating by default; a binding exact-head gate requires an explicitly scoped
          review dispatch and all normal Tabibi gate requirements.
          EOF
          printf '\nDispatch text:\n%s\n' "$DISPATCH_BODY" >> /tmp/tabibi-gemini-prompt.txt

          # Gemini CLI v0.59.0 supports stream-json. Consume that stream through a
          # redacting monitor: GitHub logs show lifecycle/tool/status events only.
          # Prompt text, assistant content, tool parameters/results and provider stderr
          # never enter the live Actions log. Assistant content is retained only for the
          # final Issue #11 result comment.
          cat > /tmp/tabibi-gemini-monitor.cjs <<'NODE'
          const fs = require('node:fs');
          const readline = require('node:readline');

          const output = fs.createWriteStream('/tmp/tabibi-gemini-output.txt', {
            flags: 'w',
            mode: 0o600,
          });
          const input = readline.createInterface({
            input: process.stdin,
            crlfDelay: Infinity,
          });

          const safeToken = (value) =>
            String(value ?? 'unknown')
              .replace(/[^a-zA-Z0-9._:/-]/g, '_')
              .slice(0, 120);

          let assistantChars = 0;
          let assistantChunks = 0;
          let toolCalls = 0;

          input.on('line', (line) => {
            let event;
            try {
              event = JSON.parse(line);
            } catch {
              console.log('[gemini] malformed structured event received; content redacted');
              return;
            }

            switch (event.type) {
              case 'init':
                console.log(`[gemini] session started model=${safeToken(event.model)}`);
                break;
              case 'tool_use':
                toolCalls += 1;
                console.log(`[gemini] tool_use #${toolCalls} name=${safeToken(event.tool_name)}`);
                break;
              case 'tool_result':
                console.log(`[gemini] tool_result status=${safeToken(event.status)}`);
                break;
              case 'message':
                if (event.role === 'assistant' && typeof event.content === 'string') {
                  output.write(event.content);
                  assistantChars += event.content.length;
                  assistantChunks += 1;
                }
                break;
              case 'error':
                console.log(`[gemini] event severity=${safeToken(event.severity)}`);
                break;
              case 'result': {
                const stats = event.stats ?? {};
                console.log(
                  `[gemini] result status=${safeToken(event.status)} ` +
                    `tool_calls=${Number(stats.tool_calls ?? toolCalls)} ` +
                    `duration_ms=${Number(stats.duration_ms ?? 0)} ` +
                    `output_tokens=${Number(stats.output_tokens ?? 0)}`,
                );
                break;
              }
              default:
                console.log(`[gemini] event type=${safeToken(event.type)}`);
            }
          });

          input.on('close', () => {
            output.end(() => {
              console.log(
                `[gemini] response captured safely chunks=${assistantChunks} chars=${assistantChars}`,
              );
            });
          });
          NODE

          start_epoch="$(date +%s)"
          (
            while true; do
              sleep 60
              now="$(date +%s)"
              elapsed="$((now - start_epoch))"
              echo "::notice title=Gemini CLI heartbeat::still running; elapsed=${elapsed}s"
            done
          ) &
          heartbeat_pid=$!

          stop_heartbeat() {
            kill "$heartbeat_pid" 2>/dev/null || true
            wait "$heartbeat_pid" 2>/dev/null || true
          }
          trap stop_heartbeat EXIT

          echo "::notice title=Gemini CLI::actor execution started; hard limit=600s; live content redacted"
          set +e
          # Do not use non-interactive plan mode here. Upstream documents special
          # plan-mode transitions in CI, and our live smoke showed it can stall after
          # read-tool calls. Default approval mode plus the explicit policy engine is
          # simpler: the policy denies every tool except the read-only allow-list.
          timeout --signal=TERM --kill-after=15s 600s \
            gemini \
              --skip-trust \
              --approval-mode=default \
              --policy /tmp/tabibi-gemini-policy.toml \
              --output-format stream-json \
              --prompt "$(cat /tmp/tabibi-gemini-prompt.txt)" \
              2> /tmp/tabibi-gemini-error.txt \
            | node /tmp/tabibi-gemini-monitor.cjs
          pipeline_codes=("${PIPESTATUS[@]}")
          set -e

          stop_heartbeat
          trap - EXIT

          actor_code="${pipeline_codes[0]:-1}"
          monitor_code="${pipeline_codes[1]:-1}"
          reason="ready"

          if [[ "$actor_code" == "124" ]]; then
            reason="Gemini CLI exceeded the 10-minute actor time limit"
          elif [[ "$actor_code" != "0" ]]; then
            reason="Gemini CLI exited without a usable result"
          elif [[ "$monitor_code" != "0" ]]; then
            actor_code=90
            reason="Gemini structured progress monitor failed"
          elif [[ ! -s /tmp/tabibi-gemini-output.txt ]]; then
            actor_code=91
            reason="Gemini CLI completed without an assistant result"
          fi

          echo "exit_code=$actor_code" >> "$GITHUB_OUTPUT"
          echo "failure_reason=$reason" >> "$GITHUB_OUTPUT"

      - name: Post Gemini result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          READY: ${{ steps.preflight.outputs.ready }}
          PREFLIGHT_REASON: ${{ steps.preflight.outputs.reason }}
          ACTOR_EXIT: ${{ steps.actor.outputs.exit_code }}
          ACTOR_REASON: ${{ steps.actor.outputs.failure_reason }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${READY:-false}" == "true" && "${ACTOR_EXIT:-1}" == "0" ]]; then
            # Defense in depth: the model has no secret-reading tool, but scrub the
            # literal provider credential and common authorization/key renderings
            # before any model-authored text can reach the public wake-bus comment.
            python - <<'PY'
          import os
          import re
          from pathlib import Path

          source = Path('/tmp/tabibi-gemini-output.txt')
          target = Path('/tmp/tabibi-gemini-public.txt')
          text = source.read_text(encoding='utf-8', errors='replace') if source.exists() else ''
          secret = os.environ.get('GEMINI_API_KEY', '')
          if secret:
              text = text.replace(secret, '[REDACTED]')
          text = re.sub(r'(?i)(authorization\s*:\s*bearer\s+)\S+', r'\1[REDACTED]', text)
          text = re.sub(r'(?i)((?:GEMINI_API_KEY|GOOGLE_API_KEY)\s*[=:]\s*)\S+', r'\1[REDACTED]', text)
          target.write_text(text[:50000], encoding='utf-8')
          PY
          fi

          {
            echo "**gemini-cli unattended wake**"
            echo
            if [[ "${READY:-false}" != "true" ]]; then
              echo "CAPACITY_DEGRADED - ${PREFLIGHT_REASON:-preflight failed}. No paid fallback was attempted."
            elif [[ "${ACTOR_EXIT:-1}" != "0" ]]; then
              echo "CAPACITY_DEGRADED - ${ACTOR_REASON:-Gemini CLI exited without a usable result}. No paid fallback was attempted."
            else
              echo '```text'
              cat /tmp/tabibi-gemini-public.txt
              echo
              echo '```'
            fi
          } > /tmp/tabibi-gemini-comment.md
          gh issue comment 11 --repo "$GITHUB_REPOSITORY" --body-file /tmp/tabibi-gemini-comment.md
