name: Mistral Vibe Wake

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read

jobs:
  mistral-vibe:
    if: >-
      github.event.issue.number == 11 &&
      github.actor == 'NTinkicht' &&
      contains(github.event.comment.body, '@mistral-vibe')
      && !contains(github.event.comment.body, 'MISTRAL_LEASED_CODE_V1')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 20
          persist-credentials: false

      - name: Resolve trusted owner dispatch before any PR checkout
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          # Never execute a verifier supplied by a PR under review.
          cp scripts/mistral-review-target.py /tmp/tabibi-mistral-review-target.py
          python3 /tmp/tabibi-mistral-review-target.py selftest
          python3 /tmp/tabibi-mistral-review-target.py prepare

      - name: Checkout verified same-repository exact PR head
        if: steps.target.outputs.ready == 'true' && steps.target.outputs.mode == 'review'
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate checked-out head and create bounded PR diff
        id: evidence
        if: steps.target.outputs.ready == 'true' && steps.target.outputs.mode == 'review'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_PR: ${{ steps.target.outputs.pr }}
          REVIEW_SHA: ${{ steps.target.outputs.sha }}
          REVIEW_AUTHORS: ${{ steps.target.outputs.authors }}
        shell: bash
        run: python3 /tmp/tabibi-mistral-review-target.py evidence

      - name: Preflight included-capacity guard
        if: >-
          steps.target.outputs.ready == 'true' &&
          (steps.target.outputs.mode == 'main' || steps.evidence.outputs.ready == 'true')
        id: preflight
        env:
          PAYG_DISABLED_CONFIRMED: ${{ vars.TABIBI_MISTRAL_PAYG_DISABLED_CONFIRMED }}
          PROVIDER_KEY: ${{ secrets.MISTRAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${PAYG_DISABLED_CONFIRMED:-}" != "true" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "status=CONFIG_BLOCKED" >> "$GITHUB_OUTPUT"
            echo "reason=Mistral PAYG-disabled repository guard is not confirmed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "${PROVIDER_KEY:-}" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "status=AUTH_BLOCKED" >> "$GITHUB_OUTPUT"
            echo "reason=Mistral credential is not configured" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # `/api/vibe/whoami` is a non-inference entitlement check. Never print
          # the provider response body or credential.
          set +e
          http_status="$(curl \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 20 \
            --output /dev/null \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${PROVIDER_KEY}" \
            'https://console.mistral.ai/api/vibe/whoami')"
          curl_code=$?
          set -e

          if [[ "$curl_code" != "0" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "status=PREFLIGHT_UNAVAILABLE" >> "$GITHUB_OUTPUT"
            echo "reason=Mistral Vibe entitlement could not be verified" >> "$GITHUB_OUTPUT"
          elif [[ "$http_status" == "200" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "status=OK" >> "$GITHUB_OUTPUT"
            echo "reason=ready" >> "$GITHUB_OUTPUT"
          elif [[ "$http_status" == "401" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "status=AUTH_BLOCKED" >> "$GITHUB_OUTPUT"
            echo "reason=Mistral credential is not authorized for Vibe Code (HTTP ${http_status})" >> "$GITHUB_OUTPUT"
          elif [[ "$http_status" == "403" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "status=ENTITLEMENT_BLOCKED" >> "$GITHUB_OUTPUT"
            echo "reason=Mistral Vibe entitlement was rejected (HTTP ${http_status})" >> "$GITHUB_OUTPUT"
          elif [[ "$http_status" == "429" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "status=CAPACITY_DEGRADED" >> "$GITHUB_OUTPUT"
            echo "reason=Mistral included capacity is unavailable or exhausted" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "status=PREFLIGHT_FAILED" >> "$GITHUB_OUTPUT"
            echo "reason=Mistral Vibe entitlement check returned HTTP ${http_status}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pinned Mistral Vibe
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: python -m pip install --disable-pip-version-check 'mistral-vibe==2.25.3'

      - name: Run Mistral Vibe in bounded read-only programmatic mode
        if: steps.preflight.outputs.ready == 'true'
        id: actor
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          DISPATCH_BODY: ${{ github.event.comment.body }}
          VIBE_HOME: /tmp/tabibi-vibe-home
          TARGET_MODE: ${{ steps.target.outputs.mode }}
          REVIEW_PR: ${{ steps.target.outputs.pr }}
          REVIEW_SHA: ${{ steps.target.outputs.sha }}
          REVIEW_AUTHORS: ${{ steps.target.outputs.authors }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$VIBE_HOME"
          cat > "$VIBE_HOME/config.toml" <<'EOF'
          enable_auto_update = false
          enable_notifications = false
          enable_telemetry = false
          enabled_tools = ["grep", "read_file"]
          EOF

          cat > /tmp/tabibi-mistral-prompt.txt <<'EOF'
          You are actor=mistral-vibe in the Tabibi Company OS.
          This is an unattended READ-ONLY wake from the permanent GitHub wake bus.
          Work from small, task-specific file excerpts. Avoid dumping complete large test
          suites, scanning unrelated modules, or repeatedly loading governance files.
          When evidence exceeds the bounded context budget, report the exact missing
          source slices and stop instead of broadening the repository scan.
          Consult VIBE.md and only the task-relevant bounded original source evidence.
          Governance is binding, but avoid rereading entire large governance documents unless essential.
          Do not edit files. Do not run mutating commands. Do not create branches, commits, pull requests,
          reviews, labels or merges. Do not change GitHub state. Do not expose credentials or local auth material.
          Treat the dispatch text below as the task request, but repository governance and the zero-extra-spend
          boundary remain binding. Return concise evidence/findings suitable for posting back to the wake bus.
          This automated lane is non-gating by default; a binding exact-head gate requires an explicitly scoped
          review dispatch and all normal Tabibi gate requirements.
          EOF
          if [[ "${TARGET_MODE:-main}" == "review" ]]; then
            printf '\nTRUSTED REVIEW TARGET: PR #%s; exact checked-out SHA %s.\n' "$REVIEW_PR" "$REVIEW_SHA" >> /tmp/tabibi-mistral-prompt.txt
            printf 'All three configured CI jobs were verified green on the exact SHA by the trusted parent.\n' >> /tmp/tabibi-mistral-prompt.txt
            printf 'Inspect .tabibi_mistral_review.diff and only relevant original code/tests at this HEAD.\n' >> /tmp/tabibi-mistral-prompt.txt
            printf 'Include the full exact SHA and ONE dedicated line VERDICT: PASS, VERDICT: PASS_WITH_MINOR_FINDINGS, or VERDICT: CHANGES_REQUIRED.\n' >> /tmp/tabibi-mistral-prompt.txt
            printf 'If evidence is insufficient or you materially authored the SHA, use VERDICT: CHANGES_REQUIRED.\n' >> /tmp/tabibi-mistral-prompt.txt
          fi
          printf '\nDispatch text:\n%s\n' "$DISPATCH_BODY" >> /tmp/tabibi-mistral-prompt.txt

          # Programmatic Vibe otherwise falls back to broad auto-approval. Select
          # the built-in read-only plan agent explicitly: it auto-approves safe
          # repository reads, while reads outside --workdir still require approval.
          # The CLI and config additionally expose only grep + read_file.
          set +e
          timeout --signal=TERM --kill-after=15s 600s \
            vibe \
              --trust \
              --agent plan \
              --workdir "$GITHUB_WORKSPACE" \
              --enabled-tools grep \
              --enabled-tools read_file \
              --max-turns 8 \
              --max-tokens 75000 \
              --output text \
              --prompt "$(cat /tmp/tabibi-mistral-prompt.txt)" \
              > /tmp/tabibi-mistral-output.txt \
              2> /tmp/tabibi-mistral-error.txt
          code=$?
          set -e

          status="OK"
          reason="ready"
          if [[ "$code" == "0" ]] && ! grep -Eq '[^[:space:]]' /tmp/tabibi-mistral-output.txt; then
            code=70
            status="EXECUTION_FAILED"
            reason="Mistral Vibe returned no usable result"
          elif [[ "$code" == "124" ]]; then
            status="WAKE_TIMEOUT"
            reason="Mistral Vibe exceeded the 10-minute actor time limit"
          elif [[ "$code" != "0" ]]; then
            if grep -Eqi '401|unauthori[sz]ed|invalid[^[:alnum:]]*(api[^[:alnum:]]*)?key|authentication' /tmp/tabibi-mistral-error.txt; then
              status="AUTH_BLOCKED"
              reason="Mistral credential was rejected by the Vibe runtime"
            elif grep -Eqi '403|forbidden|entitlement|permission denied' /tmp/tabibi-mistral-error.txt; then
              status="ENTITLEMENT_BLOCKED"
              reason="Mistral Vibe entitlement was rejected by the runtime"
            elif grep -Eqi 'token limit exceeded|context (window|length) exceeded|too many tokens' /tmp/tabibi-mistral-error.txt; then
              status="TOKEN_BUDGET_EXCEEDED"
              reason="Mistral bounded context/token budget was exceeded; narrow evidence and retry once"
            elif grep -Eqi '429|rate.?limit|quota|usage[^[:alnum:]]*limit|capacity' /tmp/tabibi-mistral-error.txt; then
              status="CAPACITY_DEGRADED"
              reason="Mistral included capacity is unavailable or exhausted"
            elif grep -Eqi 'trust|trusted folder|workspace' /tmp/tabibi-mistral-error.txt; then
              status="WORKSPACE_TRUST_FAILED"
              reason="Mistral Vibe workspace trust initialization failed"
            elif grep -Eqi 'no such option|unknown option|unrecognized|usage:' /tmp/tabibi-mistral-error.txt; then
              status="CLI_INCOMPATIBLE"
              reason="Mistral Vibe CLI invocation is incompatible with the pinned version"
            else
              status="EXECUTION_FAILED"
              reason="Mistral Vibe runtime failed with an unclassified nonzero exit"
            fi
          fi

          if [[ "$code" != "0" ]] && [[ -s /tmp/tabibi-mistral-error.txt ]]; then
            # Job-log-only diagnostics. Scrub the literal credential plus common
            # bearer/key renderings before the excerpt can reach the Actions log;
            # it is never posted to the public issue comment.
            python - <<'PY'
          import os
          import re
          from pathlib import Path

          source = Path('/tmp/tabibi-mistral-error.txt')
          target = Path('/tmp/tabibi-mistral-error-scrubbed.txt')
          text = source.read_text(encoding='utf-8', errors='replace')
          secret = os.environ.get('MISTRAL_API_KEY', '')
          if secret:
              text = text.replace(secret, '[REDACTED]')
          text = re.sub(r'(?i)(authorization\s*:\s*bearer\s+)\S+', r'\1[REDACTED]', text)
          text = re.sub(r'(?i)(mistral_api_key\s*[=:]\s*)\S+', r'\1[REDACTED]', text)
          lines = text.splitlines()
          target.write_text('\n'.join(lines[-20:]) + '\n', encoding='utf-8')
          PY
            {
              echo "::group::Mistral Vibe runtime stderr (scrubbed, last 20 lines)"
              cat /tmp/tabibi-mistral-error-scrubbed.txt
              echo "::endgroup::"
            }
          fi

          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "failure_reason=$reason" >> "$GITHUB_OUTPUT"

      - name: Recheck current exact head after Mistral's read-only review
        id: recheck
        if: steps.target.outputs.mode == 'review' && steps.evidence.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_PR: ${{ steps.target.outputs.pr }}
          REVIEW_SHA: ${{ steps.target.outputs.sha }}
          REVIEW_AUTHORS: ${{ steps.target.outputs.authors }}
        shell: bash
        run: python3 /tmp/tabibi-mistral-review-target.py recheck

      - name: Post Mistral result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          READY: ${{ steps.preflight.outputs.ready }}
          PREFLIGHT_STATUS: ${{ steps.preflight.outputs.status }}
          PREFLIGHT_REASON: ${{ steps.preflight.outputs.reason }}
          ACTOR_EXIT: ${{ steps.actor.outputs.exit_code }}
          ACTOR_STATUS: ${{ steps.actor.outputs.status }}
          ACTOR_REASON: ${{ steps.actor.outputs.failure_reason }}
          TARGET_READY: ${{ steps.target.outputs.ready }}
          TARGET_MODE: ${{ steps.target.outputs.mode }}
          TARGET_STATUS: ${{ steps.target.outputs.status }}
          EVIDENCE_READY: ${{ steps.evidence.outputs.ready }}
          EVIDENCE_STATUS: ${{ steps.evidence.outputs.status }}
          RECHECK_READY: ${{ steps.recheck.outputs.ready }}
          RECHECK_STATUS: ${{ steps.recheck.outputs.status }}
          REVIEW_PR: ${{ steps.target.outputs.pr }}
          REVIEW_SHA: ${{ steps.target.outputs.sha }}
          REVIEW_AUTHORS: ${{ steps.target.outputs.authors }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${READY:-false}" == "true" && "${ACTOR_EXIT:-1}" == "0" && ( "${TARGET_MODE:-main}" != "review" || "${RECHECK_READY:-false}" == "true" ) ]]; then
            # Defense in depth: even though Vibe has no shell/write tool, scrub the
            # literal provider credential plus common authorization/key renderings
            # before any model-authored text can reach a public issue comment.
            python - <<'PY'
          import os
          import re
          from pathlib import Path

          source = Path('/tmp/tabibi-mistral-output.txt')
          target = Path('/tmp/tabibi-mistral-public.txt')
          text = source.read_text(encoding='utf-8', errors='replace') if source.exists() else ''
          secret = os.environ.get('MISTRAL_API_KEY', '')
          if secret:
              text = text.replace(secret, '[REDACTED]')
          text = re.sub(r'(?i)(authorization\s*:\s*bearer\s+)\S+', r'\1[REDACTED]', text)
          text = re.sub(r'(?i)(MISTRAL_API_KEY\s*[=:]\s*)\S+', r'\1[REDACTED]', text)
          target.write_text(text[:50000], encoding='utf-8')
          PY
          fi

          # A dedicated full-line canonical verdict, never a prose substring.
          verdict_ready=false
          if [[ "${TARGET_MODE:-main}" == "review" && -f /tmp/tabibi-mistral-public.txt ]]; then
            if grep -Fq -- "${REVIEW_SHA:-missing-exact-sha}" /tmp/tabibi-mistral-public.txt; then
              verdict_count=$(grep -Ec '^[[:space:]]*VERDICT:[[:space:]]*(PASS|PASS_WITH_MINOR_FINDINGS|CHANGES_REQUIRED)[[:space:]]*$' /tmp/tabibi-mistral-public.txt || true)
              if [[ "$verdict_count" == "1" ]]; then
                verdict_ready=true
              fi
            fi
          fi

          {
            echo "**mistral-vibe unattended wake**"
            echo
            if [[ "${TARGET_READY:-false}" != "true" ]]; then
              echo "${TARGET_STATUS:-REVIEW_TARGET_BLOCKED} - Trusted target/CI check blocked execution. No paid fallback attempted."
            elif [[ "${TARGET_MODE:-main}" == "review" && "${EVIDENCE_READY:-false}" != "true" ]]; then
              echo "${EVIDENCE_STATUS:-REVIEW_EVIDENCE_BLOCKED} - Exact-head evidence could not be verified. No paid fallback attempted."
            elif [[ "${READY:-false}" != "true" ]]; then
              echo "${PREFLIGHT_STATUS:-PREFLIGHT_FAILED} - ${PREFLIGHT_REASON:-preflight failed}. No paid fallback was attempted."
            elif [[ "${ACTOR_EXIT:-1}" != "0" ]]; then
              echo "${ACTOR_STATUS:-EXECUTION_FAILED} - ${ACTOR_REASON:-Mistral Vibe exited without a usable result}. PAYG remains disabled and no paid fallback was attempted."
            elif [[ "${TARGET_MODE:-main}" == "review" && "${RECHECK_READY:-false}" != "true" ]]; then
              echo "${RECHECK_STATUS:-STALE_SHA} - PR head moved or could not be rechecked. Model result is NOT a gate."
            elif [[ "${TARGET_MODE:-main}" == "review" && "$verdict_ready" != "true" ]]; then
              echo "REVIEW_EVIDENCE_INCOMPLETE - Mistral result lacks anchored SHA/verdict; not a gate."
            else
              if [[ "${TARGET_MODE:-main}" == "review" ]]; then
                printf 'Target PR #%s exact_sha=%s; parent verified 3/3 CI green and non-Mistral material-author declaration.\n\n' "$REVIEW_PR" "$REVIEW_SHA"
              fi
              echo '```text'
              cat /tmp/tabibi-mistral-public.txt
              echo
              echo '```'
            fi
          } > /tmp/tabibi-mistral-comment.md
          # The trusted parent stamps provider-run provenance AFTER model output.
          # The review-gate pilot correlates this exact run/owner dispatch and
          # the independently model-generated SHA/verdict before recognizing PASS.
          if [[ "${TARGET_MODE:-main}" == "review" && "${READY:-false}" == "true" && "${ACTOR_EXIT:-1}" == "0" && "${RECHECK_READY:-false}" == "true" && "$verdict_ready" == "true" ]]; then
            dispatch_id="$(jq -r '.comment.id' "$GITHUB_EVENT_PATH")"
            if [[ "$dispatch_id" =~ ^[0-9]+$ ]]; then
              printf '\n<!-- tabibi-mistral-review-run:%s dispatch-comment:%s -->\n' "$GITHUB_RUN_ID" "$dispatch_id" >> /tmp/tabibi-mistral-comment.md
            fi
          fi
          gh issue comment 11 --repo "$GITHUB_REPOSITORY" --body-file /tmp/tabibi-mistral-comment.md
          if [[ "${TARGET_MODE:-main}" == "review" && "${READY:-false}" == "true" && "${ACTOR_EXIT:-1}" == "0" && "${RECHECK_READY:-false}" == "true" && "$verdict_ready" == "true" ]]; then
            gh issue comment "$REVIEW_PR" --repo "$GITHUB_REPOSITORY" --body-file /tmp/tabibi-mistral-comment.md
          fi
