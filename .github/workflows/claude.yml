name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  claude:
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 20

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          additional_permissions: |
            actions: read
          # Claude's issue/PR action is intentionally read-oriented by default.
          # Only owner comment on canonical WU94 PR #334 gets editing and bounded
          # test commands; an action on another issue/PR retains old permissions.
          claude_args: >-
            --max-turns 60
            --allowedTools "${{ github.event_name == 'issue_comment' && github.actor == 'NTinkicht' && github.event.issue.number == 334 && github.event.issue.pull_request && startsWith(github.event.issue.title, 'WU94:') && 'Edit,Write,Bash(npm ci),Bash(npm run format:*),Bash(npx --no-install prettier:*),Bash(npm run lint),Bash(npm run typecheck),Bash(npm run build),Bash(npm run test:*),Bash(git status:*),Bash(git diff:*)' || 'Bash(npm ci),Bash(npm run format:*),Bash(npx --no-install prettier:*)' }}"
