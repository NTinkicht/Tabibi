name: WU97 temporary formatter diagnostic
on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
permissions:
  contents: read
jobs:
  show-prettier-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install formatter only despite runner Node 20 deprecation
        env:
          npm_config_engine_strict: 'false'
        run: npm ci --ignore-scripts
      - name: Print formatter's actual deterministic delta
        run: |
          npx --no-install prettier --write tests/e2e/public-discovery-landing.spec.ts
          git diff -- tests/e2e/public-discovery-landing.spec.ts
