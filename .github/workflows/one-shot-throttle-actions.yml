name: One-shot throttle Actions polling

on:
  push:
    paths:
      - '.github/workflows/one-shot-throttle-actions.yml'

permissions:
  contents: write

jobs:
  throttle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Remove Gemini cron and verify throttles
        run: |
          python - <<'PY'
          from pathlib import Path

          gemini = Path('.github/workflows/gemini-chat-collaborator.yml')
          text = gemini.read_text(encoding='utf-8')
          old = "  schedule:\n    - cron: '*/15 * * * *'\n"
          if old in text:
              text = text.replace(old, '', 1)
              gemini.write_text(text, encoding='utf-8')

          checks = {
              '.github/workflows/slack-owner-ingest.yml': "cron: '*/30 * * * *'",
              '.github/workflows/team-heartbeat-watch.yml': "cron: '7 * * * *'",
          }
          for path, expected in checks.items():
              data = Path(path).read_text(encoding='utf-8')
              if expected not in data:
                  raise SystemExit(f'{path} missing expected throttle: {expected}')

          for path in [
              '.github/workflows/team-room-sync.yml',
              '.github/workflows/company-room-sync.yml',
              '.github/workflows/gemini-chat-collaborator.yml',
          ]:
              data = Path(path).read_text(encoding='utf-8')
              if '\n  schedule:\n' in data:
                  raise SystemExit(f'{path} still has a schedule block')

          Path('.github/workflows/one-shot-throttle-actions.yml').unlink()
          PY

      - name: Commit verified throttling
        run: |
          git config user.name 'tabibi-ops[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows
          if git diff --cached --quiet; then
            echo 'No throttle changes needed.'
            exit 0
          fi
          git commit -m 'ops: eliminate redundant polling schedules [skip ci]'
          git push origin HEAD:main
