name: L5 One-Shot Lock Refresh

on:
  push:
    branches:
      - l5/phase1-continuity
    paths:
      - 'package.json'
      - '.github/workflows/l5-lock-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor == 'NTinkicht'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: l5/phase1-continuity
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm
      - name: Refresh audited lockfile only
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund
      - name: Verify manifest did not change
        run: git diff --exit-code -- package.json
      - name: Verify high-severity audit is clean
        run: npm audit --package-lock-only --audit-level=high
      - name: Commit refreshed lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m $'fix(deps): apply audited brace-expansion lock fix\n\nMaterial-Author: chatgpt'
          git push origin HEAD:l5/phase1-continuity
