name: L5 Trusted Paths Once

on:
  push:
    branches:
      - l5/claude-hostile-controller
    paths:
      - .github/workflows/l5-trusted-paths-once.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: l5/claude-hostile-controller
      - name: Add L5.1 authority paths to manual merge gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/native_factory_merge.py')
          text = p.read_text(encoding='utf-8')
          paths = [
              '.github/workflows/l5-hostile-controller-ci.yml',
              'scripts/l5_kernel.py',
              'scripts/l5_ledger.py',
              'scripts/l5_ledger_store.py',
              'scripts/l5_controller.py',
              'scripts/l5_hostile_sim.py',
              'scripts/l5_intent_hostile_sim.py',
              'tests/test_l5_kernel.py',
              'tests/test_l5_ledger.py',
              'tests/test_l5_ledger_store.py',
              'tests/test_l5_controller.py',
              'tests/test_l5_intent_restraint.py',
              'tests/test_l5_ledger_takeover.py',
              'docs/L5-STATE-MACHINE-V1.md',
              'docs/L5-INTENT-RESTRAINT-V1.1.md',
          ]
          anchor = '    ".github/workflows/l5-write-adapter-ci.yml",\n'
          for path in paths:
              line = f'    "{path}",\n'
              if line not in text:
                  text = text.replace(anchor, anchor + line, 1)
                  anchor = line
          required_anchor = '        ".github/workflows/l5-write-adapter-ci.yml",\n'
          for path in paths:
              line = f'        "{path}",\n'
              if line not in text:
                  text = text.replace(required_anchor, required_anchor + line, 1)
                  required_anchor = line
          p.write_text(text, encoding='utf-8')
          PY
      - name: Run authenticated merge-gate selftest
        env:
          GITHUB_REPOSITORY: NTinkicht/Tabibi
          GITHUB_EVENT_PATH: /tmp/l5-event.json
          GITHUB_EVENT_NAME: workflow_dispatch
        run: |
          echo '{}' > /tmp/l5-event.json
          python scripts/native_factory_merge.py selftest
      - name: Commit trusted path update
        run: |
          git config user.name 'l5-human-authorized-hardening'
          git config user.email 'actions@users.noreply.github.com'
          git checkout HEAD -- .github/workflows/l5-trusted-paths-once.yml
          git add scripts/native_factory_merge.py
          git commit -m 'fix(l5): mark L5.1 controller paths as governed'
          git push origin HEAD:l5/claude-hostile-controller
