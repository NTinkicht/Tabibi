name: WU107 disposable Prettier diagnostics

on:
  push:
    branches: [chatgpt/wu107-search-escape]

permissions:
  contents: read

jobs:
  formatter-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Print only exact prettier delta for WU107 test
        run: |
          npx prettier tests/e2e/public-discovery-landing.spec.ts > /tmp/wu107-prettier.ts
          diff -u tests/e2e/public-discovery-landing.spec.ts /tmp/wu107-prettier.ts || true
