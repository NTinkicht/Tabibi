name: PR112 reconciliation remediation

on:
  push:
    branches:
      - chatgpt/agency-role-overlays

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'fix: make gate reconciliation newest-record authoritative') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/agency-role-overlays
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply reconciliation fix and regression test
        run: |
          python - <<'PY'
          from pathlib import Path

          script = Path('scripts/coordination/handoff-dispatcher.cjs')
          text = script.read_text()
          old = '''  for (const comment of comments) {
    if (
      !TRUSTED_ASSOCIATIONS.has(
        String(comment.author_association || '').toUpperCase(),
      )
    ) {
      continue;
    }
    const record = parseGateReconciliation(comment.body || '');
    if (!record) continue;
    if (Number(record.pr) !== Number(prNumber)) continue;
    if (record.exact_sha !== sha) continue;
    if (record.gate_actor !== artifact.actor) continue;
    if (record.reviewer_login !== reviewLogin) continue;
    if (record.overlay !== 'code-reviewer') continue;
    if (record.material_authorship !== 'independent') continue;
    if (record.status !== 'eligible') continue;
    if (
      Number(record.open_blockers) !== 0 ||
      Number(record.open_majors) !== 0
    ) {
      continue;
    }
    return record;
  }
  return null;
'''
          new = '''  let latestRecord = null;
  for (const comment of comments) {
    if (
      !TRUSTED_ASSOCIATIONS.has(
        String(comment.author_association || '').toUpperCase(),
      )
    ) {
      continue;
    }
    const record = parseGateReconciliation(comment.body || '');
    if (!record) continue;
    if (Number(record.pr) !== Number(prNumber)) continue;
    if (record.exact_sha !== sha) continue;
    if (record.gate_actor !== artifact.actor) continue;
    if (record.reviewer_login !== reviewLogin) continue;
    if (record.overlay !== 'code-reviewer') continue;
    latestRecord = record;
  }

  if (!latestRecord) return null;
  if (latestRecord.material_authorship !== 'independent') return null;
  if (latestRecord.status !== 'eligible') return null;
  if (
    Number(latestRecord.open_blockers) !== 0 ||
    Number(latestRecord.open_majors) !== 0
  ) {
    return null;
  }
  return latestRecord;
'''
          if old not in text:
              raise SystemExit('expected reconciliation block not found')
          script.write_text(text.replace(old, new))

          test = Path('tests/unit/handoff-dispatcher.test.ts')
          t = test.read_text()
          anchor = '''  it('parses only the canonical gate reconciliation schema', () => {
'''
          regression = '''  it('treats the newest matching gate reconciliation as authoritative', () => {
    const artifact = parseSpecialistReview(specialistReviewBody());
    const common = {
      prNumber: 51,
      sha: 'def456',
      artifact,
      reviewLogin: 'chatgpt-codex-connector',
    };

    expect(
      reconcileGateEligibility({
        ...common,
        comments: [
          reconciliationComment(),
          reconciliationComment({ status: 'ineligible' }),
        ],
      }),
    ).toBeNull();

    expect(
      reconcileGateEligibility({
        ...common,
        comments: [
          reconciliationComment(),
          reconciliationComment({ open_majors: '1' }),
        ],
      }),
    ).toBeNull();

    expect(
      reconcileGateEligibility({
        ...common,
        comments: [
          reconciliationComment({ status: 'ineligible' }),
          reconciliationComment(),
        ],
      }),
    ).toMatchObject({ status: 'eligible', open_majors: '0' });
  });

'''
          if regression.strip() not in t:
              if anchor not in t:
                  raise SystemExit('expected test anchor not found')
              test.write_text(t.replace(anchor, regression + anchor))
          PY

      - name: Format and test
        run: |
          npx prettier --write scripts/coordination/handoff-dispatcher.cjs tests/unit/handoff-dispatcher.test.ts
          npx vitest run tests/unit/handoff-dispatcher.test.ts
          npm run typecheck

      - name: Commit fix
        run: |
          git config user.name "tabibi-pr-remediator[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/coordination/handoff-dispatcher.cjs tests/unit/handoff-dispatcher.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: make gate reconciliation newest-record authoritative"
          git push origin HEAD:chatgpt/agency-role-overlays
