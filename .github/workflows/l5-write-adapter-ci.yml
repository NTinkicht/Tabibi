name: L5 Write Adapter Candidate CI

on:
  pull_request:
    paths:
      - 'scripts/l5_write_adapter.py'
      - 'tests/l5_write_adapter.test.py'
      - 'scripts/l5_recovery.py'
      - 'scripts/native_factory_merge.py'
      - '.github/workflows/l5-write-adapter-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: l5-write-adapter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  write-adapter:
    name: L5 guarded write adapter fault regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      # Owner-authored final gate after retry-CAS and rollback hardening; no workflow behavior change.
      - name: Compile guarded adapter and tests
        run: python -m py_compile scripts/l5_write_adapter.py tests/l5_write_adapter.test.py scripts/l5_recovery.py scripts/native_factory_merge.py
      - name: Run guarded write adapter fault tests
        run: python tests/l5_write_adapter.test.py
      - name: Run recovery selftest
        run: python scripts/l5_recovery.py --selftest
      - name: Run native merge controller selftest
        run: python scripts/native_factory_merge.py selftest
