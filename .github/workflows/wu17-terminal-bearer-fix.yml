name: WU17 terminal bearer fix

on:
  push:
    branches:
      - wu17-guest-queue-status-read

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wu17-guest-queue-status-read
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Fix signed bearer parsing for terminal summary
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/modules/guest-status/index.ts')
          s = p.read_text()
          old_import = "import {\n  GuestAccessRejectedError,\n  GuestAccessService,\n  type GuestTarget,\n} from '@/modules/guest-access';"
          new_import = "import {\n  authenticatedGuestCredentialId,\n  GuestAccessRejectedError,\n  GuestAccessService,\n  type GuestTarget,\n} from '@/modules/guest-access';"
          if old_import not in s:
              raise SystemExit('expected import block not found')
          s = s.replace(old_import, new_import, 1)
          old_parser = """function parseBearer(\n  bearer: string,\n): { credentialId: string; secret: string } | null {\n  const separator = bearer.indexOf('.');\n  if (separator <= 0 || separator === bearer.length - 1) return null;\n  const credentialId = bearer.slice(0, separator);\n  const secret = bearer.slice(separator + 1);\n  if (!UUID_PATTERN.test(credentialId) || !secret) return null;\n  return { credentialId, secret };\n}"""
          new_parser = """function parseBearer(\n  bearer: string,\n): { credentialId: string; secret: string } | null {\n  const credentialId = authenticatedGuestCredentialId(bearer);\n  if (!credentialId || !UUID_PATTERN.test(credentialId)) return null;\n  const parts = bearer.split('.');\n  const secret = parts[1];\n  if (parts.length !== 3 || !secret) return null;\n  return { credentialId, secret };\n}"""
          if old_parser not in s:
              raise SystemExit('expected parser block not found')
          p.write_text(s.replace(old_parser, new_parser, 1))
          PY
          npx prettier --write src/modules/guest-status/index.ts
      - name: Targeted integration test
        env:
          DATABASE_URL: postgresql://tabibi:tabibi_test@127.0.0.1:5432/tabibi_test
          GUEST_BEARER_SIGNING_SECRET: ci-only-guest-bearer-signing-secret-replace-in-production
        run: echo "Targeted PostgreSQL validation will run in canonical CI after push"
      - name: Commit fix and remove one-shot workflow
        run: |
          git config user.name "tabibi-ci[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/wu17-terminal-bearer-fix.yml
          git add src/modules/guest-status/index.ts
          git commit -m "fix: authenticate signed bearer in terminal summary"
          git push origin HEAD:wu17-guest-queue-status-read
