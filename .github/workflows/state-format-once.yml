name: State Format Once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: contains(github.event.head_commit.message, '[state-format]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format coordination state
        run: npx prettier --write coordination/STATE.json

      - name: Verify format
        run: npx prettier --check coordination/STATE.json

      - name: Commit state formatting
        run: |
          git config user.name 'tabibi-coordination[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add coordination/STATE.json
          if git diff --cached --quiet; then
            echo 'STATE.json already formatted.'
            exit 0
          fi
          git commit -m 'coordination: format STATE.json'
          git push origin HEAD:main
