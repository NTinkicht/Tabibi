name: Team Room Sync

on:
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: team-room-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'issue_comment' || github.event.issue.number == 21
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Mirror Team Room and derive status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          repo = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          issue_number = 21
          api = f'https://api.github.com/repos/{repo}'

          def get_json(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'tabibi-team-room-sync',
                  },
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          issue = get_json(f'{api}/issues/{issue_number}')
          comments = []
          page = 1
          while True:
              batch = get_json(f'{api}/issues/{issue_number}/comments?per_page=100&page={page}')
              comments.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          out = [
              '# Tabibi Team Interactions',
              '',
              '> Generated from GitHub Issue #21 (Team Room). Do not edit manually except to repair the sync mechanism.',
              '',
              f'- Team Room: https://github.com/{repo}/issues/{issue_number}',
              f'- Last sync: {datetime.now(timezone.utc).isoformat()}',
              '',
              '## Team Room charter',
              '',
              issue.get('body') or '',
              '',
              '## Interaction transcript',
              '',
          ]

          for comment in comments:
              actor = comment.get('user', {}).get('login', 'unknown')
              created = comment.get('created_at', 'unknown')
              updated = comment.get('updated_at')
              suffix = f' (edited {updated})' if updated and updated != created else ''
              out.extend([
                  f'### {created} — {actor}{suffix}',
                  '',
                  comment.get('body') or '',
                  '',
                  f'Source: {comment.get("html_url", "")}',
                  '',
                  '---',
                  '',
              ])

          Path('coordination/TEAM_INTERACTIONS.md').write_text('\n'.join(out).rstrip() + '\n', encoding='utf-8')

          fields = ['actor', 'role', 'work_stream', 'status', 'current_action', 'last_artifact', 'next_checkpoint', 'blocker']
          latest = {}
          heartbeat_re = re.compile(r'(?mi)^HEARTBEAT\s*$')
          field_res = {field: re.compile(rf'(?mi)^{re.escape(field)}:\s*(.+?)\s*$') for field in fields}

          for comment in comments:
              body = comment.get('body') or ''
              if not heartbeat_re.search(body):
                  continue
              parsed = {}
              for field, pattern in field_res.items():
                  match = pattern.search(body)
                  parsed[field] = match.group(1).strip() if match else ''
              actor = parsed.get('actor', '').lower()
              if actor == 'gemini':
                  actor = 'gemini_agent'
              if actor not in {'chatgpt', 'codex', 'claude', 'gemini_agent', 'gemini_chat'}:
                  continue
              parsed['actor'] = actor
              parsed['created_at'] = comment.get('created_at') or ''
              parsed['url'] = comment.get('html_url') or ''
              latest[actor] = parsed

          now = datetime.now(timezone.utc)
          status_lines = [
              '# Tabibi Team Status',
              '',
              '> Generated from latest `HEARTBEAT` comments in GitHub Issue #21. Do not edit manually except to repair the sync mechanism.',
              '',
              f'- Last sync: {now.isoformat()}',
              '- Stale threshold: 30 minutes for a lease that claims `active`, unless a visible deterministic job is still progressing.',
              '- `gemini_agent` and `gemini_chat` are distinct actors and are tracked separately.',
              '',
              '| Actor | Last heartbeat | Freshness | Role | Work stream | Status | Current action | Last artifact | Next checkpoint | Blocker |',
              '| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |',
          ]

          def cell(value):
              return (value or '—').replace('|', '\\|').replace('\n', ' ')

          for actor in ['chatgpt', 'codex', 'claude', 'gemini_agent', 'gemini_chat']:
              item = latest.get(actor)
              if not item:
                  status_lines.append(f'| {actor} | — | no heartbeat | — | — | — | — | — | — | — |')
                  continue
              freshness = 'unknown'
              try:
                  stamp = datetime.fromisoformat(item['created_at'].replace('Z', '+00:00'))
                  age_minutes = int((now - stamp).total_seconds() // 60)
                  freshness = f'{age_minutes}m old'
                  if item.get('status', '').lower() == 'active' and age_minutes >= 30:
                      freshness += ' ⚠️ stale'
              except Exception:
                  pass
              status_lines.append(
                  '| ' + ' | '.join([
                      actor,
                      cell(item.get('created_at')),
                      cell(freshness),
                      cell(item.get('role')),
                      cell(item.get('work_stream')),
                      cell(item.get('status')),
                      cell(item.get('current_action')),
                      cell(item.get('last_artifact')),
                      cell(item.get('next_checkpoint')),
                      cell(item.get('blocker')),
                  ]) + ' |'
              )

          status_lines.extend([
              '',
              '## Interpretation',
              '',
              'A fresh heartbeat is visibility, not proof of progress. Commits, CI, review findings, branch/PR movement, and merges remain the authoritative execution evidence.',
          ])
          Path('coordination/TEAM_STATUS.md').write_text('\n'.join(status_lines).rstrip() + '\n', encoding='utf-8')
          PY

      - name: Commit synchronized records
        run: |
          git config user.name 'tabibi-team-room[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add coordination/TEAM_INTERACTIONS.md coordination/TEAM_STATUS.md
          if git diff --cached --quiet; then
            echo 'No Team Room changes to commit.'
            exit 0
          fi
          git commit -m 'coordination: sync Team Room records'
          git pull --rebase origin main
          git push origin HEAD:main
