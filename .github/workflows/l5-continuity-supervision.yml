name: L5 Continuity Supervision

on:
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:
  pull_request:
    types:
      - closed

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: l5-continuity-${{ github.repository }}
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - name: Verify deterministic L5 continuity rules
        run: python scripts/l5_continuity.py --selftest
      - name: Reconcile quota and eligible work
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/l5_continuity.py
