name: WU38 exact formatter

on:
  push:
    branches:
      - wu38-notification-center-review-fixes

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wu38-notification-center-review-fixes
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply pinned Prettier
        run: npx prettier --write src/app/guest/status/GuestNotificationCenterClient.tsx tests/e2e/guest-notification-center.spec.ts
      - name: Commit exact formatter output
        run: |
          if git diff --quiet -- src/app/guest/status/GuestNotificationCenterClient.tsx tests/e2e/guest-notification-center.spec.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/guest/status/GuestNotificationCenterClient.tsx tests/e2e/guest-notification-center.spec.ts
          git commit -m "WU38: apply pinned Prettier output"
          git push origin HEAD:wu38-notification-center-review-fixes
