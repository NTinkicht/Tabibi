name: WU94 Review Fixes Formatter
on:
  push:
    branches:
      - claude/wu94-notification-dead-letter-center
permissions:
  contents: write
concurrency:
  group: one-time-wu94-review-fixes
  cancel-in-progress: true
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/wu94-notification-dead-letter-center
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Format targeted source and tests
        run: |
          set -euo pipefail
          npm ci
          ./node_modules/.bin/prettier --write 'src/app/operations/[clinicId]/notifications/notification-delivery-exceptions-client.tsx' 'src/app/styles.css' 'tests/e2e/notification-delivery-exceptions.spec.ts'
          npm run format
          npm run typecheck
          npm run lint
      - name: Commit pinned formatter output
        run: |
          set -euo pipefail
          git add -- 'src/app/operations/[clinicId]/notifications/notification-delivery-exceptions-client.tsx' 'src/app/styles.css' 'tests/e2e/notification-delivery-exceptions.spec.ts'
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(wu94): apply exact formatter output to Grok review fixes'
          git push origin HEAD:claude/wu94-notification-dead-letter-center
