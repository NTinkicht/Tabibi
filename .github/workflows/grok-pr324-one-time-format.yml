# One-time mechanical formatter for PR #324; delete after use.
name: Grok PR 324 One-Time Formatter

on:
  push:
    branches:
      - chatgpt/issue-323-grok-private-dispatch

permissions:
  contents: write

jobs:
  exact-prettier:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout canonical PR branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/issue-323-grok-private-dispatch
          fetch-depth: 0
      - name: Use repository-pinned Node and npm
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply ONLY exact repository Prettier output
        run: |
          set -euo pipefail
          npm ci
          ./node_modules/.bin/prettier --version
          ./node_modules/.bin/prettier --write scripts/grok-dispatcher.mjs tests/unit/grok-dispatcher.test.ts
          if git diff --name-only | grep -Ev '^(scripts/grok-dispatcher\.mjs|tests/unit/grok-dispatcher\.test\.ts)$'; then
            echo 'Out-of-scope file modified; refusing to push'
            exit 1
          fi
          npm run format
          npm run typecheck
          npm run lint
          npm run test:unit -- tests/unit/grok-dispatcher.test.ts
      - name: Push formatter-only update to same branch
        run: |
          set -euo pipefail
          git add -- scripts/grok-dispatcher.mjs tests/unit/grok-dispatcher.test.ts
          if git diff --cached --quiet; then
            echo 'Already formatted; no commit needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(grok): apply pinned Prettier after security remediation'
          git push origin HEAD:chatgpt/issue-323-grok-private-dispatch
