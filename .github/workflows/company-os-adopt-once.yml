name: Company OS Adopt Once

on:
  push:
    paths:
      - '.github/workflows/company-os-adopt-once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: company-os-adopt-once
  cancel-in-progress: false

jobs:
  adopt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Patch binding agent instructions
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'AGENTS.md',
              '- `coordination/COLLABORATION_PROTOCOL.md`\n- `coordination/STATE.json`',
              '- `coordination/COLLABORATION_PROTOCOL.md`\n- `coordination/COMPANY_OPERATING_SYSTEM.md`\n- `coordination/WORK_QUEUE.md`\n- `coordination/STATE.json`',
          )
          replace_once(
              'AGENTS.md',
              'GitHub Issue #21 is the permanent **Team Room**. `coordination/COLLABORATION_PROTOCOL.md` is binding.',
              'GitHub Issue #21 is the permanent **Team Room**. `coordination/COLLABORATION_PROTOCOL.md` and `coordination/COMPANY_OPERATING_SYSTEM.md` are binding. `coordination/WORK_QUEUE.md` is the human-readable marketplace for safe complementary work.',
          )
          replace_once(
              'AGENTS.md',
              'Every completed action ends with one of:\n- another actor has a valid role lease and executable next action;',
              'Every available actor should create value without duplicating the canonical implementation stream. If an actor has no active delivery lease, it checks `coordination/WORK_QUEUE.md` for safe `READY` work, claims it with `TASK_CLAIM`, or proposes a bounded useful task with `TASK_PROPOSAL`. Capacity recovery should become a useful assignment in the same orchestration cycle whenever safe work exists. Reviewer independence and anti-duplication outrank utilization.\n\nEvery completed action ends with one of:\n- another actor has a valid role lease and executable next action;',
          )
          replace_once(
              'AGENTS.md',
              'Accepted process lessons are tracked in `coordination/TEAM_LEARNING.md`; retrospective summaries are tracked in `coordination/RETROSPECTIVES.md`; the raw Team Room conversation is mirrored to `coordination/TEAM_INTERACTIONS.md`; latest heartbeats are summarized in `coordination/TEAM_STATUS.md`.',
              'Accepted process lessons are tracked in `coordination/TEAM_LEARNING.md`; retrospective summaries are tracked in `coordination/RETROSPECTIVES.md`; the raw Team Room conversation is mirrored to `coordination/TEAM_INTERACTIONS.md`; latest heartbeats are summarized in `coordination/TEAM_STATUS.md`; standups are generated into `coordination/STANDUPS.md`; and the readable group-chat view is generated into `coordination/ENGINEERING_CHAT.md`.',
          )

          replace_once(
              'CLAUDE.md',
              "You are **Claude**, one member of Tabibi's four-agent engineering mesh with ChatGPT, Codex Cloud, and Gemini.",
              "You are **Claude**, one member of Tabibi's five-actor engineering company with ChatGPT, Codex Cloud, Gemini Agent, and Gemini Chat.",
          )
          replace_once(
              'CLAUDE.md',
              '7. `coordination/COLLABORATION_PROTOCOL.md`\n8. `coordination/STATE.json`\n9. relevant recent `coordination/TEAM_LEARNING.md` / `coordination/RETROSPECTIVES.md`',
              '7. `coordination/COLLABORATION_PROTOCOL.md`\n8. `coordination/COMPANY_OPERATING_SYSTEM.md`\n9. `coordination/WORK_QUEUE.md`\n10. `coordination/STATE.json`\n11. relevant recent `coordination/TEAM_LEARNING.md` / `coordination/RETROSPECTIVES.md`',
          )
          replace_once(
              'CLAUDE.md',
              'GitHub Issue #21 is the permanent Team Room. `coordination/COLLABORATION_PROTOCOL.md` is binding.',
              'GitHub Issue #21 is the permanent Team Room. `coordination/COLLABORATION_PROTOCOL.md` and `coordination/COMPANY_OPERATING_SYSTEM.md` are binding. When active on a workday, participate in the standup/group-chat culture and use `coordination/WORK_QUEUE.md` for safe complementary work when no delivery lease is held.',
          )

          for path in ['GEMINI.md', 'GEMINI_CHAT.md']:
              replace_once(
                  path,
                  '8. `coordination/COLLABORATION_PROTOCOL.md`\n9. `coordination/STATE.json`',
                  '8. `coordination/COLLABORATION_PROTOCOL.md`\n9. `coordination/COMPANY_OPERATING_SYSTEM.md`\n10. `coordination/WORK_QUEUE.md`\n11. `coordination/STATE.json`',
              )

          p = Path('coordination/COLLABORATION_PROTOCOL.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace('# Tabibi Collaboration, Heartbeat and Learning Protocol v2', '# Tabibi Collaboration, Heartbeat and Learning Protocol v3', 1)
          text = text.replace(
              'This protocol is binding for **ChatGPT, Codex Cloud, Claude, Gemini Agent, and Gemini Chat**. It supplements `AGENTS.md`, `coordination/AUTONOMY_PROTOCOL.md`, `coordination/ROLE_FAILOVER_PROTOCOL.md`, and `coordination/STATE.json`.',
              'This protocol is binding for **ChatGPT, Codex Cloud, Claude, Gemini Agent, and Gemini Chat**. It supplements `AGENTS.md`, `coordination/AUTONOMY_PROTOCOL.md`, `coordination/ROLE_FAILOVER_PROTOCOL.md`, `coordination/COMPANY_OPERATING_SYSTEM.md`, `coordination/WORK_QUEUE.md`, and `coordination/STATE.json`.',
              1,
          )
          if '## 12. Company-mode standups, chat and work marketplace' not in text:
              text += '''\n\n## 12. Company-mode standups, chat and work marketplace\n\n`coordination/COMPANY_OPERATING_SYSTEM.md` is the binding team-culture and resource-utilization layer. It adds daily/as-active `STANDUP` reporting, engineering conversation markers (`THOUGHT`, `QUESTION`, `ANSWER`, `REFACTOR_IDEA`, `PEER_FEEDBACK`, `RISK_CALL`, `UX_NOTE`, `TEST_IDEA`, `NEWS_NOTE`, `WATERCOOLER`), and the `coordination/WORK_QUEUE.md` work marketplace.\n\nAvailable model capacity should create useful non-conflicting value. An actor without an active delivery lease checks the work queue for compatible `READY` work, claims it with `TASK_CLAIM`, or proposes a bounded useful task with `TASK_PROPOSAL`. This never authorizes duplicate implementation, competing PRs, self-gating, or scope expansion. Reviewer independence and the one-canonical-stream rule take precedence over utilization.\n\nGitHub Actions generate `coordination/STANDUPS.md` and `coordination/ENGINEERING_CHAT.md` from Team Room. Humor and informal conversation are welcome only within the safety/culture rules in the company operating system and must not replace engineering evidence.\n'''
          p.write_text(text, encoding='utf-8')
          PY

      - name: Format changed documentation
        run: |
          npm ci
          npx prettier --write AGENTS.md CLAUDE.md GEMINI.md GEMINI_CHAT.md coordination/COLLABORATION_PROTOCOL.md

      - name: Commit adoption
        run: |
          git config user.name 'tabibi-company-os[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md CLAUDE.md GEMINI.md GEMINI_CHAT.md coordination/COLLABORATION_PROTOCOL.md
          if git diff --cached --quiet; then
            echo 'Company OS already adopted.'
            exit 0
          fi
          git commit -m 'coordination: bind company operating mode'
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep 2
          done
          exit 1
