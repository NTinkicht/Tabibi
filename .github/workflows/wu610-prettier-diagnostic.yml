# TEMPORARY read-only formatting diagnostic; delete before merge.
name: WU610 temporary Prettier diff
on:
  push:
    branches:
      - l5/issue-606-eta-uncertainty-adoption
    paths:
      - .github/workflows/wu610-prettier-diagnostic.yml
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Print Prettier changes without repository writes
        run: |
          npx prettier --write src/modules/receptionist-dashboard/index.ts src/modules/public-guest-live-queue-status/index.ts tests/integration/receptionist-dashboard.test.ts tests/integration/public-guest-live-queue-status.test.ts
          git diff -- src/modules/receptionist-dashboard/index.ts src/modules/public-guest-live-queue-status/index.ts tests/integration/receptionist-dashboard.test.ts tests/integration/public-guest-live-queue-status.test.ts
