name: L5 Certification Candidate CI

on:
  pull_request:
    paths:
      - 'scripts/l5_certification.py'
      - 'tests/l5_certification.test.py'
      - 'scripts/l5_recovery.py'
      - 'scripts/l5_state_machine.py'
      - '.github/workflows/l5-certification-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Run L5 certification harness
        run: python -I scripts/l5_certification.py
      - name: Prove certification checks survive optimized mode
        run: python -O -I scripts/l5_certification.py
      - name: Run L5 certification tests
        run: python -I tests/l5_certification.test.py
      - name: Re-run underlying recovery selftests
        run: |
          python -I scripts/l5_state_machine.py --selftest
          python -I scripts/l5_recovery.py --selftest
