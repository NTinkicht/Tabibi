name: WU94 One-Time Formatter
on:
  push:
    branches:
      - claude/wu94-notification-dead-letter-center
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/wu94-notification-dead-letter-center
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Format and validate first WU94 artifact
        run: |
          set -euo pipefail
          npm ci
          ./node_modules/.bin/prettier --write 'src/app/operations/[clinicId]/notifications/notification-delivery-exceptions-client.tsx' 'src/app/operations/[clinicId]/notifications/page.tsx'
          npm run format
          npm run typecheck
          npm run lint
      - name: Commit formatter output
        run: |
          set -euo pipefail
          git add -- 'src/app/operations/[clinicId]/notifications/notification-delivery-exceptions-client.tsx' 'src/app/operations/[clinicId]/notifications/page.tsx'
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(wu94): apply exact formatter output to receptionist exceptions view'
          git push origin HEAD:claude/wu94-notification-dead-letter-center
