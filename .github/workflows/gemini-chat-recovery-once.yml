name: Gemini Chat Recovery Reconcile Once

on:
  push:
    paths:
      - '.github/workflows/gemini-chat-recovery-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Reconcile Gemini Chat capability state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('coordination/STATE.json')
          state = json.loads(p.read_text(encoding='utf-8'))

          gc = state['agents']['gemini_chat']
          gc['capability_status'] = {
              'orchestration': 'available',
              'architecture': 'available',
              'implementation': 'available',
              'review': 'available',
              'qa_ux_system_verification': 'available',
              'ci_remediation': 'available',
              'merge_execution': 'available',
          }
          gc['credential'] = (
              'Dedicated GEMINI_CHAT_API_KEY validated successfully by Gemini Chat '
              'Collaborator run 34032927675 attempt 2; raw value remains undisclosed'
          )
          gc['runtime_status'] = 'authenticated_available'
          gc['current_activity'] = (
              'onboarding completed successfully; repository read/write connectivity verified; '
              'scheduled monitoring active; no engineering role lease assigned'
          )
          gc['validation_evidence'] = {
              'workflow_run': 34032927675,
              'attempt': 2,
              'team_room_comment': 'https://github.com/NTinkicht/Tabibi/issues/21#issuecomment-5559358450'
          }

          sv = state.get('role_leases', {}).get('secondary_verifier', {})
          if 'fallback_status' in sv:
              sv['fallback_status'] = 'gemini_chat available as fallback; gemini_agent remains capacity-limited'

          state['runtime_constraints'] = [
              x for x in state.get('runtime_constraints', [])
              if not x.startswith('gemini_chat.authentication=')
          ]

          old = (
              'Gemini Chat integration infrastructure is installed, but first onboarding proved the GitHub secret is wired and non-empty '
              'while the supplied key itself is rejected by Google as invalid; no engineering work depends on Gemini Chat, so the project '
              'continues while the owner replaces that secret value.'
          )
          new = (
              'Gemini Chat authentication recovered: Gemini Chat Collaborator run 34032927675 attempt 2 succeeded and Team Room comment '
              '5559358450 verified repository read/write connectivity. Gemini Chat is available as a distinct fifth actor with scheduled '
              'monitoring active, while holding no engineering lease until explicitly assigned.'
          )
          notes = state.get('notes', '')
          state['notes'] = notes.replace(old, new) if old in notes else (notes + ' ' + new).strip()

          p.write_text(json.dumps(state, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

          git config user.name 'tabibi-coordination[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add coordination/STATE.json
          if ! git diff --cached --quiet; then
            git commit -m 'coordination: mark Gemini Chat recovered'
            git push origin HEAD:main
          fi
