name: One-shot format

on:
  push:
    branches:
      - wu17-guest-queue-status-read
    paths:
      - '.github/workflows/one-shot-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wu17-guest-queue-status-read
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Format remediation tests
        run: npx prettier --write tests/integration/guest-bearer-authorization.test.ts tests/integration/guest-status-forwarding-header.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/integration/guest-bearer-authorization.test.ts tests/integration/guest-status-forwarding-header.test.ts
          git commit -m "style: format WU17 bearer remediation tests"
          git push origin HEAD:wu17-guest-queue-status-read
