name: Temporary Grok Formatting Diff
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
jobs:
  diagnosis:
    if: github.event.pull_request.number == 390
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Print exact Prettier patch without publishing anything
        run: |
          npx prettier --write .github/workflows/grok-cloud-code-proposal.yml tests/unit/grok-cloud-code-adapter.test.ts
          git diff -- .github/workflows/grok-cloud-code-proposal.yml tests/unit/grok-cloud-code-adapter.test.ts
