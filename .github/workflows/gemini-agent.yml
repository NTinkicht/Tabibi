name: Gemini Agent Mesh

on:
  issue_comment:
    types: [created]

concurrency:
  group: gemini-agent-${{ github.event.issue.number }}-${{ github.event.comment.id }}
  cancel-in-progress: false

permissions: {}

jobs:
  review-verify-assist:
    if: >-
      github.event.sender.type == 'User' &&
      startsWith(github.event.comment.body, '@gemini-cli') &&
      !startsWith(github.event.comment.body, '@gemini-cli /implement') &&
      !startsWith(github.event.comment.body, '@gemini-cli /fix') &&
      !startsWith(github.event.comment.body, '@gemini-cli /merge') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
      actions: read
    steps:
      - name: Checkout repository instructions
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 20

      - name: Run Gemini reviewer/verifier/assistant
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_cli_version: ${{ vars.GEMINI_CLI_VERSION }}
          gemini_model: ${{ vars.GEMINI_MODEL }}
          gemini_debug: ${{ fromJSON(vars.GEMINI_DEBUG || false) }}
          github_pr_number: ${{ github.event.issue.pull_request && github.event.issue.number || '' }}
          github_issue_number: ${{ github.event.issue.number }}
          settings: |-
            {
              "model": {
                "maxSessionTurns": 60
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.27.0"
                  ],
                  "includeTools": [
                    "add_issue_comment",
                    "issue_read",
                    "list_issues",
                    "search_issues",
                    "pull_request_read",
                    "list_pull_requests",
                    "search_pull_requests",
                    "pull_request_review_write",
                    "add_comment_to_pending_review",
                    "get_commit",
                    "get_file_contents",
                    "list_commits",
                    "search_code"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                  }
                }
              }
            }
          prompt: |-
            You are Gemini in the Tabibi four-agent engineering mesh.
            Read GEMINI.md, AGENTS.md, coordination/ROLE_FAILOVER_PROTOCOL.md,
            coordination/AUTONOMY_PROTOCOL.md, coordination/STATE.json,
            PRODUCT.md, ARCHITECTURE.md and SECURITY.md before acting.

            This request was posted by an authorized repository collaborator.
            Conversation number: ${{ github.event.issue.number }}
            Is pull request: ${{ github.event.issue.pull_request != null }}

            Trusted role/task request:
            ${{ github.event.comment.body }}

            Obey the current role lease. Do not implement or modify repository files in
            this read/review job. If asked to review, independently review the exact
            requested SHA, use stable finding IDs and post a terminal verdict or precise
            findings to GitHub. If asked to verify/QA, focus on UX, Arabic/French/RTL,
            accessibility, Algeria-realistic workflows, cross-module consistency and
            missing edge cases. If asked for architecture assistance, give an independent
            recommendation but do not invent owner-level policy. End with an executable
            continuation according to the failover protocol.

  implement-fix:
    if: >-
      github.event.sender.type == 'User' &&
      (startsWith(github.event.comment.body, '@gemini-cli /implement') ||
       startsWith(github.event.comment.body, '@gemini-cli /fix')) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
      actions: read
    steps:
      - name: Checkout repository instructions
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 50

      - name: Run Gemini developer failover
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_cli_version: ${{ vars.GEMINI_CLI_VERSION }}
          gemini_model: ${{ vars.GEMINI_MODEL }}
          gemini_debug: ${{ fromJSON(vars.GEMINI_DEBUG || false) }}
          github_pr_number: ${{ github.event.issue.pull_request && github.event.issue.number || '' }}
          github_issue_number: ${{ github.event.issue.number }}
          settings: |-
            {
              "model": {
                "maxSessionTurns": 80
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.27.0"
                  ],
                  "includeTools": [
                    "add_issue_comment",
                    "issue_read",
                    "list_issues",
                    "search_issues",
                    "create_pull_request",
                    "pull_request_read",
                    "list_pull_requests",
                    "search_pull_requests",
                    "create_branch",
                    "create_or_update_file",
                    "delete_file",
                    "get_commit",
                    "get_file_contents",
                    "list_commits",
                    "push_files",
                    "search_code"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                  }
                }
              }
            }
          prompt: |-
            You are Gemini acting as a temporary Tabibi implementation runtime under a
            ROLE_LEASE_ASSIGNED failover.

            Read GEMINI.md, AGENTS.md, coordination/ROLE_FAILOVER_PROTOCOL.md,
            coordination/AUTONOMY_PROTOCOL.md, coordination/STATE.json,
            PRODUCT.md, ARCHITECTURE.md and SECURITY.md before editing anything.

            Trusted role/task request:
            ${{ github.event.comment.body }}

            Continue the existing canonical branch/PR named by the handoff whenever
            technically possible. Never create a duplicate implementation stream and
            never write feature work directly to main. Preserve all existing findings,
            tests, scope limits, security/tenant/concurrency/idempotency contracts and CI
            obligations. Implement only the bounded leased task, run/inspect available
            verification, push the exact result, then release the implementation lease
            and HANDOFF to an independent non-author reviewer with the exact SHA.

  merge:
    if: >-
      github.event.sender.type == 'User' &&
      startsWith(github.event.comment.body, '@gemini-cli /merge') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
      actions: read
    steps:
      - name: Checkout repository instructions
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 20

      - name: Run Gemini mechanical merge failover
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_cli_version: ${{ vars.GEMINI_CLI_VERSION }}
          gemini_model: ${{ vars.GEMINI_MODEL }}
          github_pr_number: ${{ github.event.issue.pull_request && github.event.issue.number || '' }}
          github_issue_number: ${{ github.event.issue.number }}
          settings: |-
            {
              "model": {
                "maxSessionTurns": 30
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.27.0"
                  ],
                  "includeTools": [
                    "add_issue_comment",
                    "issue_read",
                    "pull_request_read",
                    "merge_pull_request",
                    "get_commit",
                    "get_file_contents"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                  }
                }
              }
            }
          prompt: |-
            You are Gemini acting only as Tabibi's temporary mechanical merge executor.
            Read GEMINI.md, AGENTS.md, coordination/ROLE_FAILOVER_PROTOCOL.md,
            coordination/AUTONOMY_PROTOCOL.md and coordination/STATE.json.

            Trusted merge request:
            ${{ github.event.comment.body }}

            Do not change code. Merge only if an independent non-author reviewer emitted
            MERGE_READY for the exact unchanged current head and all deterministic merge
            gates pass. If any gate is false or ambiguous, do not merge; post the exact
            blocker and release/transfer the merge lease. After a valid merge, post
            MERGED_AND_CONTINUE and ensure the next approved work is actively handed off.
