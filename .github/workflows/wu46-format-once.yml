name: WU46 formatter once

on:
  push:
    branches:
      - wu46-release-two-clinic-isolation
    paths:
      - .github/workflows/wu46-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: wu46-release-two-clinic-isolation
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply pinned Prettier and remove helper workflow
        run: |
          npx prettier --write tests/integration/release-clinic-day-isolation.test.ts
          git rm .github/workflows/wu46-format-once.yml
      - name: Commit canonical formatting remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/integration/release-clinic-day-isolation.test.ts
          git commit -m "WU46: apply pinned Prettier formatting"
          git push origin HEAD:wu46-release-two-clinic-isolation
