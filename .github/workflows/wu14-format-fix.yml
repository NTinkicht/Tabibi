name: WU14 format fix

on:
  push:
    branches:
      - wu14-appointment-restore-transfer

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: wu14-appointment-restore-transfer
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format WU14 files
        run: npx prettier --write src/modules/appointment/recovery.ts tests/integration/appointment-recovery.test.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "tabibi-ci[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/appointment/recovery.ts tests/integration/appointment-recovery.test.ts
          git commit -m "style: format WU14 recovery files"
          git push origin HEAD:wu14-appointment-restore-transfer
