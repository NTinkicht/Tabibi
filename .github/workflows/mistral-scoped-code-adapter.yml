name: Mistral Scoped Code Adapter

on:
  issue_comment:
    types: [created]

# DEFAULT OFF unless an exact-head owner WU lease explicitly activates one run.
# The Vibe child gets READ tools only. GitHub write token only
# exists in the fresh publish job AFTER model and untrusted tests exit.
permissions:
  contents: read

jobs:
  propose:
    if: >-
      github.event.issue.number == 11 &&
      github.actor == 'NTinkicht' &&
      contains(github.event.comment.body, '@mistral-vibe') &&
      contains(github.event.comment.body, 'MISTRAL_LEASED_CODE_V1')
    runs-on: ubuntu-latest
    timeout-minutes: 14
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    concurrency:
      # Each authorized dispatch is isolated. The trusted parent checks the
      # sole-implementer lease and expected SHA again before publishing.
      group: mistral-code-${{ github.event.comment.id }}
      cancel-in-progress: false
    outputs:
      ready: ${{ steps.model.outputs.exit_code == '0' }}
      status: ${{ steps.model.outputs.status }}
      pr: ${{ steps.lease.outputs.pr }}
      sha: ${{ steps.lease.outputs.sha }}
      stream: ${{ steps.lease.outputs.stream }}
      branch: ${{ steps.lease.outputs.branch }}
      paths: ${{ steps.lease.outputs.paths }}
      lease: ${{ steps.lease.outputs.lease }}
      model_status: ${{ steps.model.outputs.status }}
      lease_status: ${{ steps.lease.outputs.status }}
      preflight_status: ${{ steps.preflight.outputs.status }}
    steps:
      - name: Checkout trusted parent from default branch
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate owner per-WU lease and PAYG-disabled guard
        id: lease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_BODY: ${{ github.event.comment.body }}
          PAYG_DISABLED_CONFIRMED: ${{ vars.TABIBI_MISTRAL_PAYG_DISABLED_CONFIRMED }}
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/mistral-code-adapter.py /tmp/tabibi-mistral-code-adapter.py
          python3 /tmp/tabibi-mistral-code-adapter.py selftest
          python3 /tmp/tabibi-mistral-code-adapter.py prepare

      - name: Checkout ONLY the verified canonical PR exact head
        if: steps.lease.outputs.ready == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.lease.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Stage ONLY allowlisted read paths for Vibe
        if: steps.lease.outputs.ready == 'true'
        env:
          ALLOWED_PATHS: ${{ steps.lease.outputs.paths }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path
          root = Path.cwd().resolve()
          stage = Path('/tmp/tabibi-mistral-readonly')
          stage.mkdir(mode=0o700)
          for path in os.environ['ALLOWED_PATHS'].split(','):
              source = root / path
              current = root
              for part in Path(path).parts:
                  current = current / part
                  if current.is_symlink():
                      raise SystemExit('READ_PATH_BLOCKED')
              if not source.is_file() or source.stat().st_size > 200_000:
                  raise SystemExit('READ_PATH_BLOCKED')
              dest = stage / path
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, dest)
          PY

      - name: Verify included Mistral entitlement without inference
        id: preflight
        if: steps.lease.outputs.ready == 'true'
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${MISTRAL_API_KEY:-}" ]]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'status=AUTH_BLOCKED' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          status="$(curl -sS --connect-timeout 10 --max-time 20 --output /dev/null --write-out '%{http_code}' --header "Authorization: Bearer ${MISTRAL_API_KEY}" 'https://console.mistral.ai/api/vibe/whoami')"
          code=$?
          set -e
          if [[ "$code" == 0 && "$status" == 200 ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'status=OK' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            case "$status" in
              401) echo 'status=AUTH_BLOCKED' >> "$GITHUB_OUTPUT" ;;
              403) echo 'status=ENTITLEMENT_BLOCKED' >> "$GITHUB_OUTPUT" ;;
              429) echo 'status=CAPACITY_DEGRADED' >> "$GITHUB_OUTPUT" ;;
              *) echo 'status=PREFLIGHT_UNAVAILABLE' >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Configure Python and pinned Vibe
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pinned Vibe
        if: steps.preflight.outputs.ready == 'true'
        run: python3 -m pip install --disable-pip-version-check 'mistral-vibe==2.25.3'

      - name: Request a bounded NON-mutating code proposal from Mistral
        id: model
        if: steps.preflight.outputs.ready == 'true'
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          VIBE_HOME: /tmp/tabibi-vibe-code-home
          REVIEW_PR: ${{ steps.lease.outputs.pr }}
          REVIEW_SHA: ${{ steps.lease.outputs.sha }}
          REVIEW_STREAM: ${{ steps.lease.outputs.stream }}
          ALLOWED_PATHS: ${{ steps.lease.outputs.paths }}
          TASK_OBJECTIVE: ${{ steps.lease.outputs.objective }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 -p "$VIBE_HOME"
          cat > "$VIBE_HOME/config.toml" <<'EOF'
          enable_auto_update = false
          enable_notifications = false
          enable_telemetry = false
          enabled_tools = ["grep", "read_file"]
          EOF
          cat > /tmp/tabibi-mistral-code-prompt.txt <<'EOF'
          You are mistral-vibe. The TRUSTED PARENT is the sole writer/pusher.
          You CANNOT edit files or run shell. Read ONLY your provided small
          explicitly leased source+test files in this isolated workdir.
          Return exactly one JSON patch bounded by the markers below.
          BEGIN_TABIBI_PATCH_JSON
          {"edits":[{"path":"src/example.ts","old":"EXACT unique existing text","new":"replacement"},{"path":"tests/example.test.ts","old":"EXACT unique existing text","new":"replacement"}]}
          END_TABIBI_PATCH_JSON
          Each path MUST be leased and exist; old text occurs exactly once.
          Change BOTH production code and its test. No secrets, no new paths,
          no Markdown fences, no self-review and no claims tests have run.
          If evidence insufficient, return a short reason without patch markers.
          EOF
          printf '\nTrusted PR #%s stream=%s SHA=%s allowed paths=%s\nOwner objective: %s\n' "$REVIEW_PR" "$REVIEW_STREAM" "$REVIEW_SHA" "$ALLOWED_PATHS" "$TASK_OBJECTIVE" >> /tmp/tabibi-mistral-code-prompt.txt
          set +e
          timeout --signal=TERM --kill-after=15s 480s vibe \
            --trust --agent plan --workdir /tmp/tabibi-mistral-readonly \
            --enabled-tools grep --enabled-tools read_file \
            --max-turns 8 --max-tokens 45000 --output text \
            --prompt "$(cat /tmp/tabibi-mistral-code-prompt.txt)" \
            > /tmp/tabibi-mistral-code.txt 2> /tmp/tabibi-mistral-code-error.txt
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [[ "$code" == 124 ]]; then
            echo 'status=WAKE_TIMEOUT' >> "$GITHUB_OUTPUT"
          elif [[ "$code" != 0 ]] && grep -Eqi 'token limit exceeded|context.*exceeded' /tmp/tabibi-mistral-code-error.txt; then
            echo 'status=TOKEN_BUDGET_EXCEEDED' >> "$GITHUB_OUTPUT"
          elif [[ "$code" != 0 ]] && grep -Eqi '429|rate.?limit|quota|capacity' /tmp/tabibi-mistral-code-error.txt; then
            echo 'status=CAPACITY_DEGRADED' >> "$GITHUB_OUTPUT"
          elif [[ "$code" != 0 ]] && grep -Eqi 'turn.?limit|max.?turns|turns.*exhausted' /tmp/tabibi-mistral-code-error.txt; then
            echo 'status=TURN_LIMIT_EXCEEDED' >> "$GITHUB_OUTPUT"
          elif [[ "$code" != 0 ]] && grep -Eqi 'not a git repository|workspace.*trust|trusted.*workspace|not trusted' /tmp/tabibi-mistral-code-error.txt; then
            echo 'status=WORKSPACE_NOT_READY' >> "$GITHUB_OUTPUT"
          elif [[ "$code" != 0 ]] && grep -Eqi 'unknown option|unrecognized arguments|no such option|invalid.*agent' /tmp/tabibi-mistral-code-error.txt; then
            echo 'status=CLI_INCOMPATIBLE' >> "$GITHUB_OUTPUT"
          elif [[ "$code" != 0 ]] && grep -Eqi '401|403|unauthorized|unauthorised|invalid.*key|entitlement' /tmp/tabibi-mistral-code-error.txt; then
            echo 'status=AUTH_OR_ENTITLEMENT_FAILED' >> "$GITHUB_OUTPUT"
          elif [[ "$code" != 0 ]]; then
            echo 'status=EXECUTION_FAILED' >> "$GITHUB_OUTPUT"
          else
            echo 'status=PROPOSAL_READY' >> "$GITHUB_OUTPUT"
          fi
          # Never print free-form provider stderr: it might contain prompt,
          # credentials or patient data. Report only fixed, allowlisted signals.
          if [[ "$code" != "0" ]]; then
            python3 - <<'PY'
          import hashlib
          import re
          from pathlib import Path

          raw = Path('/tmp/tabibi-mistral-code-error.txt').read_bytes()
          text = raw.decode('utf-8', errors='replace')
          categories = {
              'turn_limit': r'(?i)turn.?limit|max.?turns|turns.*exhausted',
              'workspace': r'(?i)not a git repository|workspace.*trust|trusted.*workspace|not trusted',
              'cli_options': r'(?i)unknown option|unrecognized arguments|no such option|invalid.*agent',
              'entitlement': r'(?i)401|403|unauthorized|unauthorised|invalid.*key|entitlement',
              'rate_limit': r'(?i)429|rate.?limit|quota|capacity',
              'context': r'(?i)token limit exceeded|context.*exceeded',
          }
          matched = [name for name, pattern in categories.items() if re.search(pattern, text)]
          print('Vibe diagnostic categories=' + (','.join(matched) if matched else 'unclassified'))
          print('Vibe stderr bytes=' + str(len(raw)))
          print('Vibe stderr sha256-prefix=' + hashlib.sha256(raw).hexdigest()[:16])
          PY
          fi

      - name: Refuse to upload a proposal that echoes the model API credential
        if: steps.model.outputs.exit_code == '0'
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/tabibi-mistral-code.txt
          if grep -Fq -- "$MISTRAL_API_KEY" /tmp/tabibi-mistral-code.txt; then
            echo 'Sensitive model transcript blocked' >&2
            exit 1
          fi

      - name: Upload only raw bounded model proposal to isolated validation runner
        if: steps.model.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: mistral-untrusted-proposal
          path: /tmp/tabibi-mistral-code.txt
          if-no-files-found: error
          retention-days: 1

  validate:
    needs: propose
    if: needs.propose.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      ready: ${{ steps.patch.outputs.ready }}
      status: ${{ steps.patch.outputs.status }}
    steps:
      - name: Fresh trusted read-only runner checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Copy fresh trusted validator and execute security selftest
        run: |
          cp scripts/mistral-code-adapter.py /tmp/tabibi-mistral-code-adapter.py
          python3 /tmp/tabibi-mistral-code-adapter.py selftest
      - name: Checkout pinned exact canonical PR head without stored token
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.propose.outputs.sha }}
          persist-credentials: false
      - name: Download raw untrusted proposal without running it
        uses: actions/download-artifact@v4
        with:
          name: mistral-untrusted-proposal
          path: /tmp
      - name: Validate model exact edits in isolated trusted read-only parent
        id: patch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_PR: ${{ needs.propose.outputs.pr }}
          REVIEW_SHA: ${{ needs.propose.outputs.sha }}
          REVIEW_STREAM: ${{ needs.propose.outputs.stream }}
          REVIEW_BRANCH: ${{ needs.propose.outputs.branch }}
          ALLOWED_PATHS: ${{ needs.propose.outputs.paths }}
          LEASE_ID: ${{ needs.propose.outputs.lease }}
        run: python3 /tmp/tabibi-mistral-code-adapter.py apply
      - name: Seal validated immutable patch before untrusted tests
        if: steps.patch.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mistral-validated-patch
          path: /tmp/tabibi-mistral-validated.json
          if-no-files-found: error
          retention-days: 1

  test:
    needs: [propose, validate]
    if: needs.validate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: read
    env:
      DATABASE_URL: postgresql://tabibi:tabibi_test@127.0.0.1:5432/tabibi_test
      GUEST_BEARER_SIGNING_SECRET: ci-only-guest-bearer-signing-secret-replace-in-production
      PUBLIC_AVAILABILITY_SELECTION_SECRET: ci-only-public-availability-selection-secret-replace-in-production
    steps:
      - name: Checkout trusted verifier
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Copy verifier outside PR worktree
        run: cp scripts/mistral-code-adapter.py /tmp/tabibi-mistral-code-adapter.py
      - name: Checkout exact PR parent
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.propose.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: mistral-validated-patch
          path: /tmp
      - name: Re-validate and apply sealed patch without write-capable token
        id: applied
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_PR: ${{ needs.propose.outputs.pr }}
          REVIEW_SHA: ${{ needs.propose.outputs.sha }}
          REVIEW_STREAM: ${{ needs.propose.outputs.stream }}
          REVIEW_BRANCH: ${{ needs.propose.outputs.branch }}
          ALLOWED_PATHS: ${{ needs.propose.outputs.paths }}
          LEASE_ID: ${{ needs.propose.outputs.lease }}
        run: python3 /tmp/tabibi-mistral-code-adapter.py applyartifact
      - uses: actions/setup-node@v4
        if: steps.applied.outputs.ready == 'true'
        with:
          node-version: '20'
          cache: npm
      - name: Unprivileged deterministic format lint typecheck unit/API and build
        if: steps.applied.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run format
          npm run lint
          npm run typecheck
          npm test
          npm run build
          git diff --check
      - name: Reject unverified/no-test artifact
        if: steps.applied.outputs.ready != 'true'
        run: exit 1

  publish:
    needs: [propose, validate, test]
    if: needs.validate.outputs.ready == 'true' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: read
    outputs:
      status: ${{ steps.publish.outputs.status }}
      result_sha: ${{ steps.publish.outputs.result_sha }}
    steps:
      - name: Fresh privileged runner checkout of trusted default branch
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Copy trusted parent and selftest before PR checkout
        run: |
          cp scripts/mistral-code-adapter.py /tmp/tabibi-mistral-code-adapter.py
          python3 /tmp/tabibi-mistral-code-adapter.py selftest
      - name: Checkout exact PR parent (no credentials retained)
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.propose.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: mistral-validated-patch
          path: /tmp
      - name: Re-verify same owner lease, SHA, allowlist and sealed patch
        id: verified
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_PR: ${{ needs.propose.outputs.pr }}
          REVIEW_SHA: ${{ needs.propose.outputs.sha }}
          REVIEW_STREAM: ${{ needs.propose.outputs.stream }}
          REVIEW_BRANCH: ${{ needs.propose.outputs.branch }}
          ALLOWED_PATHS: ${{ needs.propose.outputs.paths }}
          LEASE_ID: ${{ needs.propose.outputs.lease }}
        run: python3 /tmp/tabibi-mistral-code-adapter.py applyartifact
      - name: Parent-only non-force canonical PR push AFTER isolated tests
        id: publish
        if: steps.verified.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_PR: ${{ needs.propose.outputs.pr }}
          REVIEW_SHA: ${{ needs.propose.outputs.sha }}
          REVIEW_STREAM: ${{ needs.propose.outputs.stream }}
          REVIEW_BRANCH: ${{ needs.propose.outputs.branch }}
          ALLOWED_PATHS: ${{ needs.propose.outputs.paths }}
          LEASE_ID: ${{ needs.propose.outputs.lease }}
        run: python3 /tmp/tabibi-mistral-code-adapter.py publish

  report:
    needs: [propose, validate, test, publish]
    if: always() && github.event.issue.number == 11 && github.actor == 'NTinkicht' && contains(github.event.comment.body, 'MISTRAL_LEASED_CODE_V1')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Publish only machine-verified status without model text
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEASE_STATUS: ${{ needs.propose.outputs.lease_status }}
          PREFLIGHT_STATUS: ${{ needs.propose.outputs.preflight_status }}
          MODEL_STATUS: ${{ needs.propose.outputs.model_status }}
          PATCH_STATUS: ${{ needs.validate.outputs.status }}
          TEST_STATUS: ${{ needs.test.result }}
          PUBLISH_STATUS: ${{ needs.publish.outputs.status }}
          RESULT_SHA: ${{ needs.publish.outputs.result_sha }}
          TARGET_PR: ${{ needs.propose.outputs.pr }}
          TARGET_SHA: ${{ needs.propose.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          printf '**Mistral default-off scoped code adapter**\n\n' > /tmp/tabibi-code-status.md
          printf 'Parent gate: lease=%s; entitlement=%s; model=%s; patch=%s; isolated-tests=%s; publish=%s.\n' \
            "${LEASE_STATUS:-BLOCKED}" "${PREFLIGHT_STATUS:-SKIPPED}" "${MODEL_STATUS:-SKIPPED}" \
            "${PATCH_STATUS:-SKIPPED}" "${TEST_STATUS:-SKIPPED}" "${PUBLISH_STATUS:-SKIPPED}" >> /tmp/tabibi-code-status.md
          if [[ "${PUBLISH_STATUS:-}" == 'PUSHED' ]]; then
            printf '\nActual canonical PR #%s updated from %s to %s; fresh exact-head 3-job CI and NON-Mistral review required.\n' \
              "$TARGET_PR" "$TARGET_SHA" "$RESULT_SHA" >> /tmp/tabibi-code-status.md
          else
            printf '\nNo code delivery is claimed. No paid fallback was attempted.\n' >> /tmp/tabibi-code-status.md
          fi
          gh issue comment 11 --repo "$GITHUB_REPOSITORY" --body-file /tmp/tabibi-code-status.md
          if [[ "${PUBLISH_STATUS:-}" == 'PUSHED' ]]; then
            gh issue comment "$TARGET_PR" --repo "$GITHUB_REPOSITORY" --body-file /tmp/tabibi-code-status.md
          fi
