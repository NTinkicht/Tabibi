name: PR20 One-Time CI Autofix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  autofix:
    if: contains(github.event.head_commit.message, '[pr20-autofix]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical PR20 branch
        uses: actions/checkout@v4
        with:
          ref: claude/issue-4-work-unit-3-walkin-queue
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repair Vitest global parallelism config
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('vitest.config.ts')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "  test: {\n    projects: [",
              "  test: {\n    fileParallelism: false,\n    projects: [",
              1,
          )
          text = text.replace("          fileParallelism: false,\n", "", 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply repository Prettier formatting
        run: npm run format:write

      - name: Verify formatting and TypeScript
        run: |
          npm run format
          npm run typecheck

      - name: Commit and push remediation
        run: |
          git config user.name 'tabibi-ci-remediator[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vitest.config.ts \
            'src/app/api/clinics/[clinicId]/sessions/[sessionId]/queue/route.ts' \
            'src/app/operations/[clinicId]/sessions/[sessionId]/queue/walk-in-queue.tsx' \
            src/modules/queue/index.ts \
            tests/integration/walkin-queue.test.ts
          if git diff --cached --quiet; then
            echo 'No remediation changes were needed.'
            exit 0
          fi
          git commit -m 'Fix PR20 formatting and Vitest configuration'
          git push origin HEAD:claude/issue-4-work-unit-3-walkin-queue
