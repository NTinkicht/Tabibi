name: CI

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - 'coordination/TEAM_INTERACTIONS.md'
      - 'coordination/TEAM_STATUS.md'

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  DATABASE_URL: postgresql://tabibi:tabibi_test@127.0.0.1:5432/tabibi_test

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Paginate dispatcher issue comments
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/coordination/handoff-dispatcher.cjs')
          text = path.read_text()
          old = """async function fetchIssueComments(token, repo, number) {
            return requestJson({
              token,
              repo,
              path: `/issues/${number}/comments?per_page=100`,
            });
          }
          """
          new = """async function fetchIssueComments(token, repo, number) {
            const comments = [];
            for (let page = 1; ; page += 1) {
              const batch = await requestJson({
                token,
                repo,
                path: `/issues/${number}/comments?per_page=100&page=${page}`,
              });
              const items = Array.isArray(batch) ? batch : [];
              comments.push(...items);
              if (items.length < 100) break;
            }
            return comments;
          }
          """
          if old not in text:
              raise SystemExit('expected fetchIssueComments block not found')
          path.write_text(text.replace(old, new))
          PY
          npx prettier --write scripts/coordination/handoff-dispatcher.cjs
          git config user.name "tabibi-ci-remediator[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/coordination/handoff-dispatcher.cjs
          git commit -m "fix: paginate dispatcher issue comments"
          git push origin HEAD:${{ github.head_ref }}
          exit 1
