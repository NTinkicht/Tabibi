name: CI

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - 'coordination/TEAM_INTERACTIONS.md'
      - 'coordination/TEAM_STATUS.md'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  DATABASE_URL: postgresql://tabibi:tabibi_test@127.0.0.1:5432/tabibi_test
  GUEST_BEARER_SIGNING_SECRET: ci-only-guest-bearer-signing-secret-replace-in-production
  PUBLIC_AVAILABILITY_SELECTION_SECRET: ci-only-public-availability-selection-secret-replace-in-production

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Formatting
        run: |
          npm run format || {
            npx prettier --write src/app/guest/notification-help/page.tsx tests/e2e/guest-notification-help.spec.ts
            git diff -- src/app/guest/notification-help/page.tsx tests/e2e/guest-notification-help.spec.ts
            exit 1
          }

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and API tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: tabibi_test
          POSTGRES_USER: tabibi
          POSTGRES_PASSWORD: tabibi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tabibi -d tabibi_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run PostgreSQL integration tests
        run: npm run test:integration

      - name: Install PostgreSQL 16 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16

      - name: Rehearse PostgreSQL backup and restore
        env:
          NODE_ENV: test
          TABIBI_ALLOW_DB_RECOVERY_REHEARSAL: '1'
        run: npm run db:rehearse-recovery

      - name: Run bounded clinic-day load rehearsal
        env:
          NODE_ENV: test
          TABIBI_ALLOW_LOAD_REHEARSAL: '1'
          TABIBI_LOAD_SEED: wu43-ci-v1
          TABIBI_LOAD_CLINIC_DAY_PATIENTS: '12'
          TABIBI_LOAD_BURST_PATIENTS: '6'
          TABIBI_LOAD_CONCURRENCY: '4'
          TABIBI_LOAD_MAX_DURATION_MS: '30000'
          TABIBI_LOAD_MAX_P95_MS: '4000'
        run: npm run db:clinic-day-load

  browser-smoke:
    name: Browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: tabibi_test
          POSTGRES_USER: tabibi
          POSTGRES_PASSWORD: tabibi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tabibi -d tabibi_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run db:migrate

      - name: Build application
        run: npm run build

      - name: Install Chromium
        run: |
          for source in /etc/apt/sources.list.d/*; do
            if [ -f "$source" ] && grep -q "dl.google.com/linux/chrome-stable" "$source"; then
              sudo rm -f "$source"
            fi
          done
          npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e
