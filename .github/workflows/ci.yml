name: CI

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - 'coordination/TEAM_INTERACTIONS.md'
      - 'coordination/TEAM_STATUS.md'

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  DATABASE_URL: postgresql://tabibi:tabibi_test@127.0.0.1:5432/tabibi_test

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout canonical PR branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/agency-role-overlays
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate and commit dependency remediation
        run: |
          npm install --package-lock-only --save-exact sharp@0.35.4 vitest@4.1.11
          git config user.name "tabibi-ci-remediator[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency remediation already applied"
            exit 0
          fi
          git commit -m "fix: remediate sharp and vitest security advisories"
          git push origin HEAD:chatgpt/agency-role-overlays

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: tabibi_test
          POSTGRES_USER: tabibi
          POSTGRES_PASSWORD: tabibi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tabibi -d tabibi_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run PostgreSQL integration tests
        run: npm run test:integration

  browser-smoke:
    name: Browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: tabibi_test
          POSTGRES_USER: tabibi
          POSTGRES_PASSWORD: tabibi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tabibi -d tabibi_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run db:migrate

      - name: Build application
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e
