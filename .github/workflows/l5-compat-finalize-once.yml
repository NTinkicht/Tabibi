name: L5 Compatibility Finalize Once

on:
  push:
    paths:
      - '.github/workflows/l5-compat-finalize-once.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.ref == 'refs/heads/l5/claude-hostile-controller'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: l5/claude-hostile-controller
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Restore repository-specific compatibility layer
        shell: bash
        run: |
          set -euo pipefail
          BASE=7b439e3b698cd46975fb11ebc0f935548d637863
          git show "$BASE:scripts/l5_state_machine.py" > scripts/l5_state_machine.py
          git show "$BASE:scripts/l5_recovery.py" > scripts/l5_recovery.py
          git show "$BASE:scripts/l5_write_adapter.py" > scripts/l5_write_adapter.py
          rm -f scripts/l5_activation.py
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/l5_controller.py')
          s = p.read_text()
          s = s.replace('from l5_activation import authorize_mutation', 'from l5_recovery import authorize_mutation')
          p.write_text(s)
          PY
      - name: Validate compatibility and hardened controller
        run: |
          python scripts/l5_state_machine.py --selftest
          python scripts/l5_recovery.py --selftest
          python tests/l5_write_adapter.test.py
          python scripts/native_factory_merge.py selftest
          python scripts/l5_kernel.py
          python -m unittest discover -s tests -p 'test_l5_*.py'
          python scripts/l5_hostile_sim.py
          python scripts/l5_intent_hostile_sim.py
      - name: Commit compatibility restoration
        run: |
          git config user.name 'l5-finalize[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A scripts/l5_state_machine.py scripts/l5_recovery.py scripts/l5_write_adapter.py scripts/l5_activation.py scripts/l5_controller.py
          git commit -m 'fix(l5): preserve Tabibi certified compatibility layer'
          git push origin HEAD:l5/claude-hostile-controller
