name: SaveGrok temporary formatter diagnostic
on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
permissions:
  contents: read
jobs:
  formatter-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install formatter under runner Node 20 deprecation
        env:
          npm_config_engine_strict: 'false'
        run: npm ci --ignore-scripts
      - name: Print exact Prettier-only deterministic delta
        run: |
          npx --no-install prettier --write tests/unit/savegrok-cloud-bridge.test.ts
          git diff -- tests/unit/savegrok-cloud-bridge.test.ts
