name: Mistral temporary formatter diagnostic
on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Setup formatter under Node20 engine deprecation
        env:
          npm_config_engine_strict: 'false'
        run: npm ci --ignore-scripts
      - name: Print format-only exact changes
        run: |
          npx --no-install prettier --write tests/unit/mistral-code-adapter.test.ts
          git diff -- tests/unit/mistral-code-adapter.test.ts
