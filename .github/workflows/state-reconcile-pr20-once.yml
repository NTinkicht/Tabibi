name: PR20 State Reconcile Once
on:
  push:
    paths:
      - .github/workflows/state-reconcile-pr20-once.yml
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 20
      - name: Patch state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('coordination/STATE.json')
          s=json.loads(p.read_text())
          head='fb8b2c0471921118362ee789ee5baf1b6b123184'
          fix='02e348a381c62617fc153b8e4e9d37bc07fe4a68'
          findings=['CLAUDE-027','TAB-REVIEW-001','TAB-REVIEW-002','TAB-REVIEW-003']
          s['state']='work_unit_3_gate_pending'
          s['last_actor']='chatgpt'
          s['next_actor']='claude'
          s['next_action']='independently gate PR #20 exact current head '+head+'; verify all four finding dispositions and repeated integration evidence; issue exact-SHA PASS/MERGE_READY or actionable findings. Merge remains blocked until this gate passes.'
          s['agents']['chatgpt']['current_activity']='orchestrator/state reconciler for PR #20 and RETRO-003; implementation released after Codex completed fixes; tracking exact-head Claude gate and complementary Gemini verification.'
          c=s['agents']['codex_cloud']
          c['capability_status']={'implementation':'available','ci_remediation':'available','merge_execution':'available','review':'available'}
          c.pop('constraint',None)
          c['current_activity']='completed PR #20 fix commit '+fix+' with three consecutive 25/25 real-Postgres integration runs; current branch head '+head+' has green exact-head CI; awaiting Claude gate.'
          s['agents']['claude']['current_activity']='independent gating reviewer assigned to PR #20 exact current head '+head+'; fresh handoff PR comment 5559538324; RETRO-003 responsibilities remain active.'
          s['agents']['gemini_chat']['current_activity']='secondary verifier + UX/localization/system reviewer for PR #20 exact head '+head+' and RETRO-003 participant; clean retry dispatched in Team Room comment 5559540606.'
          leases=s['role_leases']
          leases['implementer']={'actor':'codex','status':'complete_awaiting_gate','work_stream':'issue-4-work-unit-3-pr-20','last_authored_sha':fix,'current_branch_head':head,'reason':'Codex completed all four reviewed fixes; no active implementation until an independent gate returns new findings.'}
          leases['gating_reviewer']={'actor':'claude','status':'assigned_awaiting_verdict','review_target_sha':head,'verdict':'PENDING_REREVIEW','open_findings':findings,'handoff_comment':'https://github.com/NTinkicht/Tabibi/pull/20#issuecomment-5559538324','reason':'Codex authored the application fixes; Claude remains eligible independent non-author gate.'}
          leases['secondary_verifier']={'actor':'gemini_chat','status':'assigned_awaiting_verification','review_target_sha':head,'focus':'Algeria clinic usability, Arabic/French/RTL, patient-vs-staff locale, mobile/receptionist workflow, privacy, system edge cases','fallback_candidates':['gemini_agent'],'fallback_status':'Gemini Agent bounded recovery probe pending; no recovery inferred without evidence.'}
          leases['merge_executor']={'actor':'codex','fallback_order':['chatgpt','gemini_chat','gemini_agent','claude'],'status':'blocked_on_independent_gate','reason':'Exact-head CI is green but findings remain open until Claude independently verifies and posts MERGE_READY.'}
          for f in s.get('pending_findings',[]):
              if f.get('id') in findings:
                  f['fix_status']='fix_pushed_awaiting_independent_review'
                  f['fix_sha']=fix
                  f['current_review_target_sha']=head
          s['runtime_constraints']=[x for x in s.get('runtime_constraints',[]) if not x.startswith('codex.general=')]
          cw=s['current_work']
          cw['implementation_status']='fixes_pushed_ci_green_awaiting_independent_gate'
          cw['current_head']=head
          cw['implementation_fix_sha']=fix
          cw['review_target_head']=head
          cw['review_verdict']='PENDING_REREVIEW'
          cw['ci_run']=34035987885
          cw['ci_status']='success_exact_current_head'
          cw['ci_passed']=['Quality and build','PostgreSQL integration','Browser smoke']
          cw['ci_remaining']=[]
          cw['ci_caveat']='Codex reported three consecutive 25/25 real-Postgres integration passes on '+fix+'; exact current head '+head+' has all required GitHub CI jobs green. Findings stay open until Claude gates this exact head.'
          p.write_text(json.dumps(s,indent=2,ensure_ascii=False)+'\n')
          PY
          git config user.name tabibi-coordination-bot
          git config user.email github-actions@users.noreply.github.com
          git add coordination/STATE.json
          git commit -m 'coordination: reconcile PR20 gate state'
          git pull --rebase origin main
          git push origin HEAD:main
