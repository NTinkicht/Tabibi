name: Native Factory Merge Controller

on:
  workflow_run:
    workflows:
      - CI
      - Mistral Vibe Wake
    types:
      - completed
  pull_request_review:
    types:
      - submitted
      - dismissed
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read
  issues: read

concurrency:
  group: native-factory-merge-${{ github.repository }}
  cancel-in-progress: false

jobs:
  authorize-review:
    name: L4 review authorization
    if: github.event_name == 'pull_request_review'
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
      issues: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Fail closed on L5 authority-path self-amendment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess

          repo = os.environ["GITHUB_REPOSITORY"]
          event = json.loads(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8").read())
          number = event.get("pull_request", {}).get("number")
          if not number:
              raise SystemExit("AUTHORITY_GUARD_PR_UNAVAILABLE")
          protected = {
              ".l5/control-plane.json",
              "docs/L5-POST-CLAUDE-CUTOVER.md",
              "scripts/l5_control_plane.py",
              "tests/test_l5_control_plane.py",
              "tests/fixtures/l5-control-plane-active.json",
          }
          result = subprocess.run(
              ["gh", "api", "--paginate", f"repos/{repo}/pulls/{number}/files?per_page=100", "--jq", ".[ ].filename".replace(" ", "")],
              text=True, capture_output=True, check=True,
          )
          changed = set(result.stdout.splitlines())
          if changed & protected:
              raise SystemExit("TRUSTED_GATE_CHANGE_REQUIRES_EXTERNAL_MERGE")
          PY
      - name: Authorize exact-head review from trusted main
        env:
          GH_TOKEN: ${{ github.token }}
          L4_AUTHORIZE_ONLY: '1'
        run: python scripts/native_factory_merge.py

  reconcile-and-merge:
    if: github.event_name != 'pull_request_review'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Fail closed while any L5 authority-path PR is open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, subprocess

          repo = os.environ["GITHUB_REPOSITORY"]
          protected = {
              ".l5/control-plane.json",
              "docs/L5-POST-CLAUDE-CUTOVER.md",
              "scripts/l5_control_plane.py",
              "tests/test_l5_control_plane.py",
              "tests/fixtures/l5-control-plane-active.json",
          }
          pulls = subprocess.run(
              ["gh", "api", "--paginate", f"repos/{repo}/pulls?state=open&per_page=100", "--jq", ".[ ].number".replace(" ", "")],
              text=True, capture_output=True, check=True,
          ).stdout.splitlines()
          for raw_number in pulls:
              if not raw_number.isdigit():
                  raise SystemExit("AUTHORITY_GUARD_PR_INVALID")
              number = int(raw_number)
              changed = set(subprocess.run(
                  ["gh", "api", "--paginate", f"repos/{repo}/pulls/{number}/files?per_page=100", "--jq", ".[ ].filename".replace(" ", "")],
                  text=True, capture_output=True, check=True,
              ).stdout.splitlines())
              if changed & protected:
                  raise SystemExit(f"TRUSTED_GATE_CHANGE_REQUIRES_EXTERNAL_MERGE PR #{number}")
          PY
      - name: Reconcile exact-head merge gates from trusted main
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/native_factory_merge.py
